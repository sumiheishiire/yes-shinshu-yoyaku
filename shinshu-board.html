<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Generated by Claude | 2026-09-03 | shinshu-board.html -->
<meta name="generator" content="Claude">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>家ッス！信州 みんなのボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --panel:#fff; --ink:#2b2723; --muted:#7f7568; --line:#e4ddd1;
  --wood:#9a6b3f; --forest:#2f5d50; --kaki:#c9622c; --sky:#3f7096; --red:#b03a2e;
  --slate:#565f72;
  --shadow:0 1px 3px rgba(60,45,30,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.7;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.ttl{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

/* ===== ゲート ===== */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:900}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 26px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.gate-box h1{font-size:21px;margin-bottom:4px;color:var(--forest)}
.gate-box .sub{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.gate-box label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px}
.gate-box input,.gate-box select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fdfcfa}
.gate-box input:focus,.gate-box select:focus{outline:2px solid var(--wood);outline-offset:-1px}
.gate-box button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--forest);color:#fff;font-weight:700;font-size:15px}
.gate-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}

/* ===== ヘッダ ===== */
header{background:var(--forest);color:#fff;padding:12px 16px 0}
.hd-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;max-width:1120px;margin:0 auto}
.hd-top h1{font-size:18px;letter-spacing:.04em}
.hd-top .who{margin-left:auto;font-size:12px;opacity:.85}
.hd-top .who button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:1px 9px;font-size:11px;margin-left:6px}
nav{display:flex;gap:2px;max-width:1120px;margin:10px auto 0;overflow-x:auto}
nav button{background:rgba(255,255,255,.10);border:0;color:#fff;padding:9px 15px;border-radius:8px 8px 0 0;white-space:nowrap;font-size:13.5px;opacity:.75}
nav button.on{background:var(--bg);color:var(--forest);font-weight:700;opacity:1}

main{max-width:1120px;margin:0 auto;padding:16px 16px 80px}

/* ===== 汎用 ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card>h2{font-size:14.5px;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h2 .cnt{background:var(--bg);border-radius:11px;padding:0 9px;font-size:12px;color:var(--muted);font-weight:500}
.card .body{padding:13px 15px}
.empty{color:var(--muted);font-size:13px;padding:14px 15px}
.tag{display:inline-block;border-radius:11px;padding:1px 9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.t-todo{background:#efece6;color:#6b6154}
.t-doing{background:#e3eef6;color:var(--sky)}
.t-wait{background:#faece2;color:var(--kaki)}
.t-done{background:#e2efea;color:var(--forest)}
.t-none{background:#fbe9e7;color:var(--red);font-weight:700}
.due{font-size:12px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--red);font-weight:700}
.due.soon{color:var(--kaki);font-weight:700}
.btn{border:1px solid var(--line);background:#fdfcfa;border-radius:7px;padding:5px 12px;font-size:12.5px;color:var(--ink);transition:transform .08s,background .15s}
.btn:hover{background:#f2ede4}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:500}
.btn-p:hover{background:#26493f}
.btn-w{background:var(--wood);color:#fff;border-color:var(--wood);font-weight:500}
.btn-w:hover{background:#835831}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== 分類（イベント／広報／運営／会議） ===== */
.cat-pill{display:inline-flex;align-items:center;gap:4px;border-radius:11px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.cat-filter{border:1.5px solid transparent;background:#f0ece2;border-radius:14px;padding:4px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:transform .08s}
.cat-filter:active{transform:scale(.95)}
.cat-filter.on{border-color:currentColor}
.cat-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.cat-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;flex:0 0 auto;cursor:default}

/* ===== 担当（会社アバター） ===== */
.ownchip{display:inline-flex;align-items:center;gap:5px;border-radius:14px;padding:2px 10px 2px 2px;font-size:11.5px;font-weight:500;background:#f3efe6;color:var(--ink)}
.ownchip.none{background:#fbe9e7;color:var(--red);font-weight:700}
.ava{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:-.02em}
.ownchip.none .ava{background:repeating-linear-gradient(45deg,#f0a99e,#f0a99e 3px,#fbe9e7 3px,#fbe9e7 6px);border:1px solid #e8a99c}
.ava.ava-none{background:repeating-linear-gradient(45deg,#f0a99e,#f0a99e 3px,#fbe9e7 3px,#fbe9e7 6px);border:1px solid #e8a99c;cursor:default}
.ownwall{display:flex;flex-wrap:wrap;gap:10px}
.owntile{display:flex;align-items:center;gap:9px;background:#fbf9f5;border:1px solid var(--line);border-radius:13px;padding:8px 16px 8px 8px;min-width:150px;transition:transform .1s}
.owntile:hover{transform:translateY(-1px)}
.owntile .ava{width:32px;height:32px;font-size:12px}
.owntile .nm{font-size:12.5px;font-weight:500}
.owntile .ct{margin-left:auto;font-size:18px;font-weight:700;color:var(--wood)}
.owntile.warn{border-color:#eec3b8;background:#fdf3f1}
.owntile.warn .ct{color:var(--red)}

/* ===== 時系列＋ToDo 左右分割 ===== */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.split>*{min-width:0}
.split-side{position:sticky;top:12px}
@media(max-width:900px){.split-side{position:static}}
.side-list{max-height:calc(100vh - 220px);overflow-y:auto}
@media(max-width:900px){.side-list{max-height:none}}
.side-filter{display:flex;gap:5px;flex-wrap:wrap}
.side-filter button{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px 10px;font-size:11.5px;color:var(--muted);transition:transform .08s}
.side-filter button:active{transform:scale(.92)}
.side-filter button.on{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}

/* ===== かんばん ===== */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start;margin-bottom:14px}
@media(max-width:860px){.kanban{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.kanban{grid-template-columns:1fr}}
.kcol{background:#efe9db;border-radius:13px;padding:8px}
.kcol h3{font-size:12.5px;padding:4px 6px 9px;display:flex;align-items:center;gap:6px;color:#665c4d;font-weight:700}
.kcol h3 .n{margin-left:auto;background:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.kempty{color:var(--muted);font-size:12px;padding:10px 6px;text-align:center}
.kcard{background:#fff;border-radius:11px;padding:10px 11px 8px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid transparent;transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(60,45,30,.16)}
.kt{font-size:12.5px;line-height:1.5;margin:6px 0 8px;cursor:pointer}
.kmeta{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.kmove{display:flex;justify-content:space-between;gap:6px;border-top:1px dotted var(--line);padding-top:7px}
.kbtn{flex:1;border:1px solid var(--line);background:#fdfcfa;border-radius:7px;padding:5px 4px;font-size:11px;color:var(--muted);transition:transform .08s}
.kbtn:active{transform:scale(.94)}
.kbtn-p{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:600}

/* ===== アラート ===== */
.alert{border-radius:12px;padding:12px 15px;margin-bottom:12px;border:1px solid}
.al-red{background:#fdf0ee;border-color:#f0c8c0}
.al-kaki{background:#fdf3ec;border-color:#f2d8c2}
.al-open{background:#fbf6e9;border-color:#ecdcb4}
.alert h3{font-size:13.5px;margin-bottom:7px}
.al-red h3{color:var(--red)} .al-kaki h3{color:var(--kaki)} .al-open h3{color:#96721c}
.al-line{font-size:13px;padding:3px 0;border-top:1px dotted rgba(0,0,0,.10);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.al-line:first-of-type{border-top:0}
.al-line .ev{color:var(--muted);font-size:11.5px}
.al-line .lk{background:none;border:0;color:var(--ink);text-align:left;text-decoration:underline;text-underline-offset:2px;padding:0;font-size:13px}
.ev-chip{background:#f0ece2;border:0;border-radius:11px;padding:2px 9px;font-size:10.5px;color:var(--wood);font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .08s}
.ev-chip:active{transform:scale(.95)}

/* ===== タスク行 ===== */
.tk{border-top:1px solid var(--line);border-left:4px solid transparent}
.tk:first-child{border-top:0}
.tk-hd{display:flex;gap:9px;padding:9px 15px 10px;align-items:flex-start;transition:background .1s}
.tk-hd:hover{background:#fbf9f5}
.tk-chk{width:20px;height:20px;flex:0 0 auto;margin-top:3px;accent-color:var(--forest);cursor:pointer}
.tk-mid{flex:1;min-width:0}
.tk-top{margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ov-badge{font-size:11px;color:var(--red);font-weight:700;background:#fdecea;border-radius:9px;padding:1px 8px}
.tk-ttl{font-size:13.5px;line-height:1.55;cursor:pointer}
.tk.is-done .tk-ttl{text-decoration:line-through;color:var(--muted)}
.tk-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tk-own{font-size:11.5px;color:var(--wood);font-weight:500}
.tk-cm{font-size:11.5px;color:var(--sky)}
.tag.pill-click{cursor:pointer;transition:transform .08s}
.tag.pill-click:active{transform:scale(.92)}

/* ===== 詳細 ===== */
.det{background:#fbf9f5;border-top:1px dashed var(--line);padding:13px 15px}
.det label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.det .fld{margin-bottom:10px}
.det input,.det select,.det textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:14px}
.det textarea{resize:vertical;min-height:52px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.cmlist{margin:12px 0 8px;border-top:1px solid var(--line);padding-top:10px}
.cm{padding:7px 0;border-bottom:1px dotted var(--line);font-size:13px}
.cm:last-child{border-bottom:0}
.cm .m{font-size:11.5px;color:var(--muted);margin-bottom:1px}
.cm .m b{color:var(--wood);font-weight:700}

/* ===== タイムライン ===== */
.tl-wrap{overflow-x:auto;padding:0 0 6px}
.tl{min-width:860px;padding:0 15px 12px}
.tl-months{display:flex;border-bottom:1px solid var(--line);position:relative}
.tl-months div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0;border-left:1px solid var(--line)}
.tl-months div:first-child{border-left:0}
.tl-rows{position:relative;padding-top:8px}
.tl-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.tl-grid div{flex:1;border-left:1px solid #efe9de}
.tl-grid div:first-child{border-left:0}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--kaki);z-index:3;pointer-events:none}
.tl-now::after{content:'今日';position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:var(--kaki);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.tl-row{position:relative;height:36px;z-index:2}
.tl-bar{position:absolute;top:4px;height:28px;border-radius:6px;padding:0 9px;display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;cursor:pointer;overflow:hidden;white-space:nowrap;box-shadow:var(--shadow)}
.tl-bar b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tl-bar .pg{font-size:10.5px;background:rgba(255,255,255,.25);border-radius:8px;padding:0 6px;flex:0 0 auto}
.tl-lbl{position:absolute;top:9px;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ===== フィード ===== */
.fd{padding:10px 15px;border-top:1px solid var(--line);font-size:13px}
.fd:first-child{border-top:0}
.fd .m{font-size:11.5px;color:var(--muted)}
.fd .m b{color:var(--wood)}
.fd .ctx{font-size:11.5px;color:var(--sky);margin-top:2px}

.foot{max-width:1120px;margin:0 auto;padding:8px 16px 40px;font-size:11.5px;color:var(--muted);line-height:1.9}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(47,93,80,.96);color:#fff;padding:9px 16px;font-size:12.5px;text-align:center;z-index:500}
/* ナビ：パソコンはアイコン＋文字を横並び、スマホは縦積み（下のメディアクエリ） */
nav button{display:flex;align-items:center;gap:6px}
nav button .ic{font-size:15px;line-height:1}
.hd-top .who #gear{font-size:13px;padding:2px 8px;line-height:1.3}

/* ===== 担当の切替チップ（予定・やること 共通） ===== */
.who-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who-chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1.5px solid var(--line);
  border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--ink);transition:transform .08s}
.who-chip:active{transform:scale(.94)}
.who-chip .n{font-size:11px;color:var(--muted);font-weight:700}
.who-chip.on{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}
.who-chip.on .n{color:rgba(255,255,255,.85)}
.who-chip.mine.on{background:var(--wood);border-color:var(--wood)}
.who-chip.none.on{background:var(--red);border-color:var(--red)}

/* ===== 注意帯（期限切れ・担当なし） ===== */
.strip{display:flex;gap:8px;align-items:center;width:100%;background:#fdf0ee;border:1px solid #f0c8c0;
  border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:13px;color:var(--red);font-weight:700;text-align:left}
.strip.ok{background:#e9f2ee;border-color:#c9e0d6;color:var(--forest)}
.strip .arw{margin-left:auto;font-size:12px;opacity:.7}
.strip:active{transform:scale(.99)}

/* ===== 追加ボタン（右下に常駐。どの画面からでも1タップで足せる） ===== */
#fab{position:fixed;right:16px;bottom:22px;z-index:350;width:56px;height:56px;border-radius:50%;
  background:var(--wood);color:#fff;border:0;font-size:28px;line-height:1;
  box-shadow:0 4px 14px rgba(60,45,30,.32);transition:transform .1s}
#fab:active{transform:scale(.92)}

/* ===== 下から出るシート（追加・編集用） ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(40,32,24,.45);z-index:700;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:701px){
  .sheet-bg{align-items:center}
  .sheet{max-width:540px;border-radius:16px;padding-bottom:18px}
}
.sheet-ttl{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:17px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.sheet-ttl .x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);padding:0 4px}
.f-lb{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.sheet input[type=text],.sheet input[type=date],.sheet select,.sheet textarea{
  width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fdfcfa;font-size:16px}
.sheet textarea{min-height:70px;resize:vertical;line-height:1.6}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:2px solid var(--wood);outline-offset:-1px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick-b{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:8px 14px;
  font-size:13px;color:var(--ink);transition:transform .08s}
.pick-b:active{transform:scale(.94)}
.pick-b.on{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}
.sheet-act{display:flex;gap:9px;margin-top:20px}
.sheet-act .btn{flex:1;padding:13px;font-size:15px;border-radius:11px;font-weight:700}

/* ===== 進め方（手順）の表示 ===== */
.flow{border-top:1px solid var(--line);background:#fbfaf7}
.flow-hd{padding:11px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--wood)}
.flow-hd .pg{margin-left:auto;font-size:11px;color:var(--muted);background:#fff;border-radius:10px;padding:2px 9px}
.fstep{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px dotted var(--line)}
.fstep .no,.fs-no{width:23px;height:23px;border-radius:50%;background:#e6e0d3;color:#6b6154;font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fstep.done .no{background:var(--forest);color:#fff}
.fstep.now{background:#fdf6e9}
.fstep.now .no{background:var(--kaki);color:#fff}
.fstep .ft{flex:1;min-width:0;font-size:13px;line-height:1.45}
.fstep.done .ft>span:first-child{color:var(--muted);text-decoration:line-through}
.fstep .fm{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:5px}
.nowtag{font-size:10px;font-weight:700;color:#fff;background:var(--kaki);border-radius:8px;padding:2px 8px}

/* ===== 一覧の区切り見出し ===== */
.sec-hd{font-size:12px;font-weight:700;color:var(--wood);background:#f4efe5;padding:7px 14px;
  letter-spacing:.03em;display:flex;align-items:center;gap:7px}
.sec-hd .n{margin-left:auto;color:var(--muted);font-weight:700}

/* ===== 月別アジェンダ（スマホの時系列） ===== */
.ag{border-top:1px solid var(--line)}
.ag:first-child{border-top:0}
.ag-hd{width:100%;background:none;border:0;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.ag-hd:active{background:#fbf9f5}
.ag-bar{width:5px;align-self:stretch;border-radius:3px;flex:0 0 auto}
.ag-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ag-ttl{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-sub{font-size:11.5px;color:var(--muted)}
.ag-right{display:flex;align-items:center;gap:7px;flex:0 0 auto}

const $  = s=>document.querySelector(s);
const esc= s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = (()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
const dnum = s=>s?Number(String(s).replace(/-/g,'')):0;
const daysTo = s=>{ if(!s) return null; return Math.round((new Date(s+'T00:00:00') - new Date(todayStr+'T00:00:00'))/86400000); };
const mmdd = s=>s?s.slice(5).replace('-','/'):'';
const nowIso = ()=>new Date().toISOString();
const fmtTime = iso=>{ if(!iso) return ''; const d=new Date(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

function banner(msg){ const b=$('#bar'); if(!msg){b.hidden=true;return;} b.textContent=msg; b.hidden=false; }

/* ---------- Firestore 接続 ---------- */
// ページを開いた時点で先に匿名サインインだけ済ませておく（合言葉を入れる前でも、
// 「お名前」欄の入力候補（会社ごとのメンバー名）を出せるようにするため）。
// 本編（予定・ToDo・やりとり）の読み込みは、合言葉を通った後の start() から。
function connectFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
  }catch(err){ return; }
  firebase.auth().signInAnonymously().then(()=>{
    col('members').onSnapshot(snap=>{
      S.members=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      if(S.me) render(); else refreshNameSuggestions();
    });
  }).catch(()=>{ /* 名前候補が出ないだけ。ログイン後にもう一度つなぎ直します */ });
}
function refreshNameSuggestions(){
  const dl=$('#g-name-list'); const sel=$('#g-comp'); if(!dl||!sel) return;
  const co=sel.value;
  const names=[...new Set(S.members.filter(m=>m.company===co).map(m=>m.name))].sort((a,b)=>a.localeCompare(b,'ja'));
  dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
}
connectFirebase();

function start(){
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.tab; S.openTask=null;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    render(); window.scrollTo(0,0);
  });
  const go=()=>{
    banner('接続しています…');
    firebase.auth().signInAnonymously()
      .then(()=>{ ONLINE=true; bindAll(); })
      .catch(err=>fallback('サインインできませんでした：'+err.message));
  };
  if(db && firebase.auth().currentUser){ ONLINE=true; bindAll(); }
  else if(db){ go(); }
  else{
    try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.firestore(); go(); }
    catch(err){ fallback('つながりませんでした：'+err.message); }
  }
  render();
}
function bindAll(){
  const bind=(name,key)=>col(name).onSnapshot(snap=>{
      S[key]=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      banner(''); render(); applyDeepLink();
    }, err=>{ fallback('読み込みに失敗しました：'+err.message); });
  bind('events','events'); bind('tasks','tasks');
  bind('comments','comments'); bind('activity','activity');
  render();
  setTimeout(()=>{ if(!S.events.length && ONLINE)
    banner('データがまだありません。［設定］タブの「議事録から初期データを入れる」を一度だけ押してください。'); },2500);
}
function fallback(msg){
  ONLINE=false;
  S.events=SEED_EVENTS.map(e=>({id:e.id,title:e.t,start:e.s,end:e.e,lead:e.lead,color:e.c,memo:e.memo}));
  S.tasks=SEED_TASKS.map((t,i)=>({id:'seed'+i,eventId:t.ev,title:t.t,owner:t.o,due:t.d,status:t.st,note:t.n}));
  banner('⚠ '+msg+'（表示のみ・保存はできません）');
  if(S.me){ render(); applyDeepLink(); }
}
// LINEメッセージの「詳細」リンク（#tk-<id> / #ev-<id>）で開いたとき、
// 該当のToDo・イベントまで自動で連れて行く。1回開いたら以降は触らない。
let deepLinkDone=false;
function applyDeepLink(){
  if(deepLinkDone) return;
  const h=location.hash;
  if(!h) return;
  if(h.startsWith('#tk-')){
    const id=h.slice(4);
    if(!S.tasks.some(t=>t.id===id)) return; // まだ読み込み中の可能性があるので、見つかるまで待つ
    deepLinkDone=true;
    S.tab='time'; S.openTask=id;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='time'));
    render();
    setTimeout(()=>{ const el=document.getElementById('tk-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },60);
  }else if(h.startsWith('#ev-')){
    const id=h.slice(4);
    if(!S.events.some(e=>e.id===id)) return;
    deepLinkDone=true;
    S.tab='time'; S.openTask=null;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='time'));
    render();
    setTimeout(()=>{ const el=document.getElementById('ev-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60);
  }
}

/* ---------- 書き込み ---------- */
function log(text, taskId){
  if(!ONLINE) return;
  col('activity').add({text, taskId:taskId||'', by:S.me.name, company:S.me.company, at:nowIso()});
}
function saveTask(id, patch, logText){
  if(!ONLINE){ alert('いまオフラインのため保存できません。'); return; }
  patch.updatedAt=nowIso(); patch.updatedBy=S.me.name;
  col('tasks').doc(id).update(patch)
    .then(()=>{ if(logText) log(logText, id); })

}

/* ---------- 参照ヘルパ ---------- */
const evOf   = id=>S.events.find(e=>e.id===id);
const evName = id=>{const e=evOf(id); return e?e.title:'（イベント未設定）';};
const tasksOf= id=>S.tasks.filter(t=>t.eventId===id);
const cmOf   = id=>S.comments.filter(c=>c.taskId===id).sort((a,b)=>(a.at>b.at?1:-1));
const isOpen = t=>!t.owner || !String(t.owner).trim();
const alive  = t=>t.status!=='done';
function dueCls(t){
  if(!alive(t)||!t.due) return '';
  const d=daysTo(t.due);
  if(d===null) return '';
  if(d<0) return 'over'; if(d<=7) return 'soon'; return '';
}
function evSorted(){
  return S.events.slice().sort((a,b)=>dnum(a.start)-dnum(b.start)||String(a.id).localeCompare(String(b.id)));
}
function catOfEvent(e){ return EVENT_CAT_OVERRIDE[e.id] || guessCat(e.title); }
function catOfTask(t){
  const parentEv = evOf(t.eventId);
  const parentCat = parentEv ? catOfEvent(parentEv) : 'event';
  if(parentCat==='meeting') return 'meeting'; // 理事会配下はすべて会議扱い
  const own = guessCat(t.title);
  return own!=='event' ? own : parentCat; // タイトルに手がかりが無ければ親イベントに合わせる
}

/* ---------- 日付の表示（時系列バーのホバーで使う） ---------- */
const WD_JA = ['日','月','火','水','木','金','土'];
function fmtDateJa(s){
  if(!s) return '';
  const d = new Date(s+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}（${WD_JA[d.getDay()]}）`;
}
function fmtRangeJa(s,e){
  if(!s) return '';
  if(!e || s===e) return fmtDateJa(s);
  return `${fmtDateJa(s)} 〜 ${fmtDateJa(e)}`;
}

function closeSheet(){ const d=$('#sheet'); if(d) d.remove(); document.body.style.overflow=''; }
function openSheet(inner){
  closeSheet();
  const d=document.createElement('div');
  d.className='sheet-bg'; d.id='sheet';
  d.innerHTML=`<div class="sheet">${inner}</div>`;
  d.onclick=e=>{ if(e.target===d) closeSheet(); };   // 外側をタップで閉じる
  document.body.appendChild(d);
  document.body.style.overflow='hidden';
  d.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeSheet);
  // 選択チップ（1つだけ選べる）
  d.querySelectorAll('.pick').forEach(g=>{
    g.querySelectorAll('.pick-b').forEach(b=>b.onclick=()=>{
      g.querySelectorAll('.pick-b').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(g.dataset.target){                      // 期限チップ → 日付欄へ反映
        const el=d.querySelector('#'+g.dataset.target);
        if(el) el.value = quickDate(b.dataset.d);
      }
    });

  return d;
}
/* 「今日」「明日」などを実際の日付に変換する */
function quickDate(k){
  if(k===''||k==null) return '';
  const d=new Date();
  if(k==='sat'){ d.setDate(d.getDate()+((6-d.getDay()+7)%7)); }
  else d.setDate(d.getDate()+Number(k));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function sheetAddFlow(evId, key){
  if(!ONLINE){ alert('いまオフラインのため追加できません。'); return; }
  const e=evOf(evId); if(!e) return;

  // まずは種類えらび
  if(!key){
    const d=openSheet(`
      <div class="sheet-ttl">📋 進め方を追加<button class="x" data-x="1">✕</button></div>

        期限は実施日から逆算して自動で入ります。担当は次の画面で変えられます。</div>
      <div class="sheet-act" style="flex-direction:column">
        ${Object.entries(FLOWS).map(([k,f])=>
          `<button class="btn btn-w" data-flow="${k}" style="padding:15px;text-align:left">

      </div>`);

    return;
  }

  // 手順の確認・担当の割り当て
  const f=FLOWS[key];
  const base=e.start;
  const dateOf=n=>{ const dt=new Date(base+'T00:00:00'); dt.setDate(dt.getDate()-n);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); };
  const d=openSheet(`
    <div class="sheet-ttl">${f.icon} ${esc(f.name)}<button class="x" data-x="1">✕</button></div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">
      「${esc(e.title)}」の実施日 ${fmtDateJa(base)} から逆算しています。担当は自由に直せます（外部業者もそのまま入力できます）。</div>
    ${f.steps.map((s,i)=>`
      <div style="border-top:1px solid var(--line);padding:11px 0">
        <div style="display:flex;gap:9px;align-items:center">

               style="margin-top:7px;padding:9px 10px;font-size:14px" placeholder="例：田中建築・鈴木太郎">
      </div>`).join('')}
    ${ownerDatalist()}
    <div class="sheet-act">
      <button class="btn" data-x="1">やめる</button>
      <button class="btn btn-p" id="fl-go">${f.steps.length}件を登録する</button>
    </div>`);
  d.querySelector('#fl-go').onclick=async()=>{
    const owners=[...d.querySelectorAll('.fl-own')].map(i=>i.value.trim());
    closeSheet();
    try{
      const batch=db.batch();
      f.steps.forEach((s,i)=>{

/* ---------- 進め方の表示（いまどこまで進んでいるかを1枚で） ---------- */
function flowBlocks(evId){
  const ts=tasksOf(evId).filter(t=>t.flow);
  if(!ts.length) return '';
  const groups={};
  ts.forEach(t=>{ (groups[t.flow]=groups[t.flow]||[]).push(t); });
  return Object.entries(groups).map(([k,arr])=>{
    arr.sort((a,b)=>(a.step||0)-(b.step||0));
    const f=FLOWS[k]||{name:arr[0].flowName||'進め方',icon:'📋'};
    const done=arr.filter(t=>t.status==='done').length;
    const nowIdx=arr.findIndex(t=>t.status!=='done');
    return `<div class="flow">
      <div class="flow-hd">${f.icon} ${esc(f.name)}の進め方<span class="pg">${done}/${arr.length} 完了</span></div>
      ${arr.map((t,i)=>{
        const isDone=t.status==='done', isNow=i===nowIdx;
        return `<div class="fstep ${isDone?'done':''} ${isNow?'now':''}">
          <span class="no">${isDone?'✓':(t.step||i+1)}</span>
          <span class="ft"><span data-open="${t.id}" style="cursor:pointer">${esc(t.title)}</span>
            <span class="fm">${ownAvatar(t.owner,t.assignee)}
              ${t.due?`<span class="due ${dueCls(t)}">${mmdd(t.due)}まで</span>`:''}
              ${isNow?'<span class="nowtag">いまここ</span>':''}</span></span>
          <input type="checkbox" class="tk-chk" data-done="${t.id}" ${isDone?'checked':''} style="margin-top:1px">
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

/* 担当の候補：6社＋事務局に加えて、実際に使われている外部業者も自動で拾う
   （例：チラシ作成をツタエルの山口さんに頼む、など） */
/* 担当の見た目情報。未登録の相手（外部業者など）でも自然な略称になるようにする
   例：「ツタエル（山口さん）」→ツタエル ／「その他・協力業者」→その他 */
function ownerMeta(o){
  const company = ownerCompany(o); // 「社名・担当者名」形式に対応
  if(OWNER_META[company]) return OWNER_META[company];
  if(OWNER_META[o]) return OWNER_META[o]; // 互換性のため
  const base=String(o||'').split(/[（(]/)[0];
  return {abbr: base.slice(0,4).replace(/[・･\-\s]+$/,'') || base.slice(0,2), color:'#8a8378'};
}
function allOwners(){
  const set=new Set(COMPANIES);
  S.tasks.forEach(t=>{ if(t.owner) set.add(t.owner); });
  S.events.forEach(e=>{ if(e.lead) set.add(e.lead); });
  return [...set];
}
function ownerDatalist(){
  return `<datalist id="owner-list">${allOwners().map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
}

/* ---------- 担当の切替チップ（予定・やることで共通に使う） ---------- */
function ownerBar(){
  const o=S.owner, me=S.me.company;
  const n=f=>S.tasks.filter(t=>alive(t)&&f(t)).length;
  const chip=(key,label,cls,count)=>
    `<button class="who-chip ${cls} ${o===key?'on':''}" data-owner="${esc(key)}">${label}${count!=null?`<span class="n">${count}</span>`:''}</button>`;
  let h=`<div class="who-bar">`;
  h+=chip('all','ぜんぶ','', n(()=>true));
  h+=chip(me,'自分','mine', n(t=>t.owner===me));
  h+=chip('none','担当なし','none', n(isOpen));
  // 6社・事務局のあと、実際に使われている外部業者（ツタエル等）も並べる
  const listed=[...COMPANIES, ...allOwners().filter(o=>!COMPANIES.includes(o))];
  h+=listed.filter(c=>c!==me).map(c=>{
    const m=ownerMeta(c);
    const on=o===c, cnt=n(t=>t.owner===c);
    if(!OWNER_META[c] && !cnt) return '';   // 使われていない外部業者は出さない
    return `<button class="who-chip ${on?'on':''}" data-owner="${esc(c)}" title="${esc(c)}"
      style="${on?`background:${m.color};border-color:${m.color};color:#fff`:''}">${esc(m.abbr)}<span class="n">${cnt}</span></button>`;
  }).join('');
  return h+`</div>`;
}

/* 担当フィルターを1か所で適用する */
function applyOwner(list){
  const o=S.owner;
  if(o==='all') return list;
  if(o==='none') return list.filter(isOpen);
  return list.filter(t=>t.owner===o);
}

/* ---------- 注意帯：期限切れと担当なしを1行で ---------- */
function warnStrip(){
  const live=S.tasks.filter(alive);
  const over=live.filter(t=>t.due&&daysTo(t.due)<0).length;
  const none=live.filter(isOpen).length;
  if(!over && !none) return `<div class="strip ok">✅ 期限切れ・担当なしはありません</div>`;
  const parts=[];
  if(over) parts.push(`期限切れ ${over}件`);
  if(none) parts.push(`担当なし ${none}件`);
  return `<button class="strip" data-warn="${over?'over':'none'}">⚠ ${parts.join('　／　')}<span class="arw">見る ▸</span></button>`;
}

/* ===== 時系列 ===== */
function viewTime(){
  const t0=new Date(FY_START+'T00:00:00'), t1=new Date(FY_END+'T00:00:00');
  const span=(t1-t0)/86400000+1;
  const pos=d=>Math.max(0,Math.min(100,((new Date(d+'T00:00:00')-t0)/86400000)/span*100));

  const months=[]; let m=new Date(t0);
  while(m<=t1){ months.push((m.getMonth()+1)+'月'); m.setMonth(m.getMonth()+1); }

  // 担当者フィルター：主担当（lead）か、その担当のToDoを1件でも持つイベントだけに絞る
  const so = S.owner||'all';
  const evRelevant = e=>{
    if(so==='all') return true;
    if(so==='none') return !e.lead;
    return e.lead===so || tasksOf(e.id).some(t=>t.owner===so);
  };
  const evs=evSorted().filter(evRelevant);
  const soLabel = so==='none' ? '担当なし' : so;
  const rows=evs.map(e=>{
    const ts=tasksOf(e.id), done=ts.filter(t=>t.status==='done').length;
    const cat=catOfEvent(e);
    const L=pos(e.start), R=pos(e.end||e.start);
    const W=Math.max(1.6, R-L+ (100/span));
    const openN=ts.filter(t=>alive(t)&&isOpen(t)).length;
    const label=`${CAT[cat].icon} <b>${esc(e.title)}</b>${ts.length?`<span class="pg">${done}/${ts.length}</span>`:''}${openN?`<span class="pg">担当未定${openN}</span>`:''}`;
    const short = W<26;
    // 右寄りの短いバーは、ラベルが画面外へはみ出すのでバーの左側に置く
    const toLeft = short && L>58;
    const lblTxt = CAT[cat].icon+' '+esc(e.title)+(ts.length?`（${done}/${ts.length}）`:'')+(openN?'　担当未定'+openN:'');
    const lblPos = toLeft ? `right:calc(${100-L}% + 6px)` : `left:calc(${L}% + ${W}% + 6px)`;
    const tip = `${esc(e.title)}：${fmtRangeJa(e.start,e.end)}`;
    return `<div class="tl-row">
      <div class="tl-bar" data-ev="${e.id}" title="${tip}" style="left:${L}%;width:${W}%;background:${CAT[cat].c}">${short?'':label}</div>
      ${short?`<div class="tl-lbl" title="${tip}" style="${lblPos}">${lblTxt}</div>`:''}
    </div>`;
  }).join('');

  const nowL=pos(todayStr);
  let left=`<div class="card"><h2>年間の流れ <span class="cnt">${FY_START.slice(0,7).replace('-','/')} 〜 ${FY_END.slice(0,7).replace('-','/')}</span>${so!=='all'?`<span class="cnt" style="color:var(--wood);font-weight:700">🎯 ${esc(soLabel)}：${evs.length}件</span>`:''}</h2>
    ${evs.length?`<div class="tl-wrap"><div class="tl">
      <div class="tl-months">${months.map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="tl-rows">
        <div class="tl-grid">${months.map(()=>'<div></div>').join('')}</div>
        ${(nowL>0&&nowL<100)?`<div class="tl-now" style="left:${nowL}%"></div>`:''}
        ${rows}
      </div></div></div>`:`<div class="empty">${esc(soLabel)}が関わるイベントはありません。</div>`}</div>`;

  left+=evs.map(e=>{
    const ts=tasksOf(e.id).slice().sort((a,b)=>dnum(a.due||'9999-99-99')-dnum(b.due||'9999-99-99'));
    const done=ts.filter(t=>t.status==='done').length;
    const per=e.start===e.end?e.start.replace(/-/g,'/'):`${e.start.replace(/-/g,'/')}〜${(e.end||'').slice(5).replace('-','/')}`;
    return `<div class="card" id="ev-${e.id}">
      <h2>${catBadge(catOfEvent(e))}
        ${esc(e.title)} <span class="cnt">${per}</span>${ts.length?`<span class="cnt">${done}/${ts.length}完了</span>`:''}
        ${ownChip(e.lead)}</h2>
      ${e.memo?`<div class="body" style="font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)">${esc(e.memo)}</div>`:''}
      ${flowBlocks(e.id)}
      ${ts.filter(t=>!t.flow).length? ts.filter(t=>!t.flow).map(t=>taskRow(t)).join('') : (flowBlocks(e.id)?'':'<div class="empty">このイベントのToDoはまだありません。</div>')}
      <div class="body" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-w" data-newtask="${e.id}">＋ ToDoを足す</button>
        <button class="btn" data-addflow="${e.id}">📋 進め方を追加</button>
      </div>
    </div>`;
  }).join('');

  // ===== 右：予定を見ながらそのまま消せるToDo =====
  let sideList = applyOwner(S.tasks.filter(alive))
    .sort((a,b)=>dnum(a.due||'9999-99-99')-dnum(b.due||'9999-99-99'));
  const right=`<div class="split-side">
    <div class="card"><h2>✅ 未完了のToDo <span class="cnt">${sideList.length}件</span></h2>
      <div class="side-list">
        ${sideList.length? sideList.map(t=>taskRow(t,true)).join('') : '<div class="empty">該当するToDoはありません。</div>'}
      </div>
      <div class="body"><button class="btn" data-goto-task="1">✅ やること画面をひらく</button></div>
    </div>
  </div>`;

  // 画面のいちばん上：注意帯と担当の切替（スマホ・パソコン共通）
  const top = warnStrip() + `<div class="card"><div class="body">${ownerBar()}</div></div>`;

  // スマホは横スクロールのガントが使えないので、月ごとの縦リストに差し替える。
  // イベントをタップするとその場でToDoが開く（アコーディオン）。
  if(isMobile()){
    const byMonth={};
    evs.forEach(e=>{ const k=(e.start||'').slice(0,7); (byMonth[k]=byMonth[k]||[]).push(e); });
    const agenda = Object.keys(byMonth).sort().map(k=>{
      const y=+k.slice(0,4), mo=+k.slice(5,7);
      return `<div class="mon-hd">${y}年 ${mo}月</div>` + byMonth[k].map(agendaRow).join('');
    }).join('');
    const head=`<div class="card"><h2>📅 予定 <span class="cnt">${evs.length}件</span></h2>
      ${evs.length? agenda : `<div class="empty">${esc(soLabel)}が関わるイベントはありません。</div>`}</div>`;
    return top + head;
  }

  return top + `<div class="split"><div>${left}</div>${right}</div>`;
}

/* ===== 月別アジェンダの1行（スマホ用） ===== */
function agendaRow(e){
  const ts=tasksOf(e.id).slice().sort((a,b)=>dnum(a.due||'9999-99-99')-dnum(b.due||'9999-99-99'));
  const plain=ts.filter(t=>!t.flow);   // 手順ぶんは flowBlocks 側で表示する
  const done=ts.filter(t=>t.status==='done').length;
  const openN=ts.filter(t=>alive(t)&&isOpen(t)).length;
  const cat=catOfEvent(e);
  const on=S.openEvent===e.id;
  return `<div class="ag" id="ev-${e.id}">
    <button class="ag-hd" data-agev="${e.id}">
      <span class="ag-bar" style="background:${CAT[cat].c}"></span>
      <span class="ag-mid">
        <span class="ag-ttl">${CAT[cat].icon} ${esc(e.title)}</span>
        <span class="ag-sub">${fmtRangeJa(e.start,e.end)}${ts.length?` ・ ${done}/${ts.length}完了`:''}${e.lead?` ・ ${esc(e.lead)}`:''}</span>
      </span>
      <span class="ag-right">
        ${openN?`<span class="ag-warn">未定${openN}</span>`:''}
        <span class="ag-caret${on?' up':''}">▾</span>
      </span>
    </button>
    ${on?`<div class="ag-body">
      ${e.memo?`<div class="ag-memo">${esc(e.memo)}</div>`:''}
      ${flowBlocks(e.id)}
      ${plain.length? plain.map(t=>taskRow(t)).join('') : (flowBlocks(e.id)?'':'<div class="empty">このイベントのToDoはまだありません。</div>')}
      <div class="body" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-w" data-newtask="${e.id}">＋ ToDoを足す</button>
        <button class="btn" data-addflow="${e.id}">📋 進め方を追加</button>
      </div>
    </div>`:''}
  </div>`;
}

/* ===== やること（1画面・フィルター1行だけ） ===== */
function viewTask(){
  let list = applyOwner(S.tasks.slice());
  if(!S.showDone) list = list.filter(alive);
  // 期限が近い順。期限なしは最後
  list.sort((a,b)=>dnum(a.due||'9999-99-99')-dnum(b.due||'9999-99-99'));

  const me=S.me.company;
  let h = warnStrip();
  h += `<div class="card"><div class="body">
      ${ownerBar()}
      <div class="row" style="margin-top:10px">
        <button class="btn ${S.showDone?'btn-p':''}" data-toggledone="1">${S.showDone?'✅ 完了も表示中':'完了は隠しています'}</button>
        <span style="flex:1"></span>
        <button class="btn btn-w" data-newtask="">＋ ToDoを足す</button>
      </div>
    </div></div>`;

  if(!list.length) return h+'<div class="card"><div class="empty">該当するToDoはありません。</div></div>';

  // 「ぜんぶ」のときだけ、自分の担当を先頭にまとめて出す（30名それぞれが自分の分をすぐ見つけられるように）
  if(S.owner==='all'){
    const mine=list.filter(t=>t.owner===me);
    const none=list.filter(t=>isOpen(t));
    const rest=list.filter(t=>t.owner!==me && !isOpen(t));
    const sec=(title,icon,arr)=> arr.length
      ? `<div class="sec-hd">${icon} ${title}<span class="n">${arr.length}件</span></div>${arr.map(t=>taskRow(t,true)).join('')}` : '';
    h+=`<div class="card">
      ${sec('あなたの担当（'+esc(me)+'）','📌',mine)}
      ${sec('担当が決まっていない','🙋',none)}
      ${sec('ほかの会社の担当','　',rest)}
    </div>`;
  }else{
    h+=`<div class="card">${list.map(t=>taskRow(t,true)).join('')}</div>`;
  }

  h+=`<div class="card"><div class="body">
      <button class="btn" data-grp="board" data-openboard="1">📋 かんばんで見る（未着手→進行中→完了）</button>
      <button class="btn" onclick="window.print()">🖨 印刷</button>
    </div></div>`;
  return h;
}

/* ===== かんばん（別画面あつかい。ふだんは使わなくてよい） ===== */
function viewBoard(){
  let list = applyOwner(S.tasks.slice());
  let h = `<div class="card"><div class="body">
      <button class="btn" data-openboard="0">← やること一覧にもどる</button>
      <div style="margin-top:10px">${ownerBar()}</div>
    </div></div>`;
  return h + viewTaskBoard(list);
}

/* ===== タスク1行 ===== */
function taskRow(t, showEv){
  const open=S.openTask===t.id;
  const cat=catOfTask(t);
  const cls=['tk', t.status==='done'?'is-done':''].filter(Boolean).join(' ');
  const nc=cmOf(t.id).length;
  let h=`<div class="${cls}" id="tk-${t.id}" style="border-left-color:${CAT[cat].c}">
    <div class="tk-hd">
      <input type="checkbox" class="tk-chk" data-done="${t.id}" ${t.status==='done'?'checked':''}>
      <div class="tk-mid">
        <div class="tk-ttl" data-open="${t.id}">${catDot(cat)} ${esc(t.title)}</div>
        <div class="tk-meta">
          ${ownAvatar(t.owner, t.assignee)}
          ${t.due?`<span class="due ${dueCls(t)}" title="${fmtDateJa(t.due)}">${mmdd(t.due)}まで</span>`:''}
          ${t.status!=='todo'&&t.status!=='done'?statusPill(t,true):''}
          ${t.flow?`<span class="due" title="${esc(t.flowName||'')}の${t.step}番目の工程">${(FLOWS[t.flow]||{}).icon||'📋'} ${t.step}/${t.stepTotal}</span>`:''}
          ${showEv?evChip(t.eventId):''}
          ${nc?`<span class="tk-cm">💬${nc}</span>`:''}
        </div>
      </div>
    </div>`;
  if(open) h+=taskDetail(t);
  return h+'</div>';
}

/* ===== ToDo一覧：かんばんボード ===== */
function viewTaskBoard(list){
  const cols=[['todo','未着手'],['doing','進行中'],['wait','相談中'],['done','完了']];
  const body=cols.map(([key,label])=>{
    const items=list.filter(t=>t.status===key).sort((a,b)=>dnum(a.due||'9999-99-99')-dnum(b.due||'9999-99-99'));
    const cards=items.map(t=>{
      const cat=catOfTask(t);
      const idx=STATUS_ORDER.indexOf(key);
      const prevKey=STATUS_ORDER[idx-1], nextKey=STATUS_ORDER[idx+1];
      return `<div class="kcard" style="border-left-color:${CAT[cat].c}">
        <div class="kt" data-open="${t.id}">${catDot(cat)} ${esc(t.title)}</div>
        <div class="kmeta">${ownAvatar(t.owner, t.assignee)}${t.due?`<span class="due ${dueCls(t)}" title="${fmtDateJa(t.due)}">📅${mmdd(t.due)}</span>`:''}${evChip(t.eventId)}</div>
        <div class="kmove">
          ${prevKey?`<button class="kbtn" data-mv="${t.id}" data-to="${prevKey}">◀ 戻す</button>`:'<span></span>'}
          ${nextKey?`<button class="kbtn kbtn-p" data-mv="${t.id}" data-to="${nextKey}">進める ▶</button>`:'<span></span>'}
        </div>
      </div>`;
    }).join('');
    return `<div class="kcol"><h3>${ST_ICON[key]} ${label}<span class="n">${items.length}</span></h3>${cards||'<div class="kempty">まだありません</div>'}</div>`;
  }).join('');
  let h=`<div class="kanban">${body}</div>`;
  if(S.openTask){
    const t=S.tasks.find(x=>x.id===S.openTask);
    if(t) h+=`<div class="card"><div class="tk" style="border-left-color:${CAT[catOfTask(t)].c}">${taskDetail(t)}</div></div>`;
  }
  return h;
}

/* ===== やりとり ===== */
function viewFeed(){
  const all=S.comments.slice().sort((a,b)=>(a.at<b.at?1:-1));
  let h=`<div class="card"><h2>みんなへの投げかけ</h2><div class="body">
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">
      特定のToDoに紐づかない相談・確認はここへ。「これ誰がやりますか？」「この日程で大丈夫ですか？」など、遠慮なくどうぞ。</div>
    <div style="display:flex;gap:7px">
      <input type="text" id="cm-in-general" placeholder="例：9/26の駐車場、どこか候補ありませんか？" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:7px">
      <button class="btn btn-p" data-cm="general">送る</button>

        <div class="m"><b>${esc(c.by)}</b>（${esc(c.company||'')}）　${fmtTime(c.at)}</div>
        ${esc(c.body).replace(/\n/g,'<br>')}
        ${c.taskId&&c.taskId!=='general'?`<div class="ctx">→ <button class="lk" data-jump="${c.taskId}" style="background:none;border:0;color:var(--sky);text-decoration:underline;padding:0;font-size:11.5px">${esc((S.tasks.find(t=>t.id===c.taskId)||{}).title||'（削除されたToDo）')}</button></div>`:''}
      </div>`).join('') : '<div class="empty">まだやりとりはありません。</div>'}</div>`;

  // だれが何件持っているか（進み具合の確認用）
  const live=S.tasks.filter(alive), byOwner={};
  live.forEach(t=>{ const k=t.owner||''; byOwner[k]=(byOwner[k]||0)+1; });
  const rows=Object.entries(byOwner).sort((a,b)=>{ if(a[0]==='')return -1; if(b[0]==='')return 1; return b[1]-a[1]; });
  h+=`<div class="card"><h2>👥 いま誰が何件持っているか <span class="cnt">未完了のみ</span></h2><div class="body">
      <div class="ownwall">${rows.map(([k,n])=>{
        const none=k==='';
        const m=none?null:ownerMeta(k);
        return `<div class="owntile${none?' warn':''}">
          <span class="ava" style="${none?'background:repeating-linear-gradient(45deg,#f0a99e,#f0a99e 3px,#fdf3f1 3px,#fdf3f1 6px);border:1px solid #e8a99c':`background:${m.color}`}">${none?'？':esc(m.abbr)}</span>
          <span class="nm">${none?'担当なし':esc(k)}</span><span class="ct">${n}</span></div>`;
      }).join('')}</div></div></div>`;

  const act=S.activity.slice().sort((a,b)=>(a.at<b.at?1:-1)).slice(0,15);
  h+=`<div class="card"><h2>🕒 直近の動き</h2>
      ${act.length? act.map(a=>`<div class="fd"><div class="m"><b>${esc(a.by)}</b>${a.company?`（${esc(a.company)}）`:''}　${fmtTime(a.at)}</div>${esc(a.text)}</div>`).join('')
        : '<div class="empty">まだ動きがありません。</div>'}</div>`;
  return h;
}

/* ===== 設定 ===== */
function viewConf(){
  return `<div class="card"><h2>このボードの使い方</h2><div class="body" style="font-size:13px">
    <p style="margin-bottom:9px"><b>1. 見る</b>　［いま何がある］に、期限切れ・今週の締切・<u>担当が決まっていないToDo</u>が出ます。まずここだけ見てください。</p>
    <p style="margin-bottom:9px"><b>2. 拾う</b>　担当なしのToDoを開いて「これ、私がやります」を押すと、あなたの会社が担当になり、全員に見えます。</p>
    <p style="margin-bottom:9px"><b>3. 聞く</b>　どのToDoにも「これ大丈夫？」ボタンとコメント欄があります。メールで個別に聞かず、ここに書けば全員が同じ答えを見られます。</p>
    <p style="margin-bottom:9px"><b>4. 終わったら</b>　左のチェックを付けるだけ。誰がいつ終わらせたかは自動で記録されます。</p>
    <p style="color:var(--red)"><b>お客様の氏名・住所・電話番号は絶対に書き込まないでください。</b>合言葉は目隠しであって鍵ではありません。来場者名簿などは各社で管理してください。</p>
  </div></div>
  <div class="card"><h2>メンバー一覧 <span class="cnt">これまでにログインした方</span></h2><div class="body">
    ${(()=>{
      const byCo={}; const seen=new Set();
      S.members.slice().sort((a,b)=>(a.at<b.at?1:-1)).forEach(m=>{
        const key=m.company+'::'+m.name;
        if(seen.has(key)) return; seen.add(key);
        (byCo[m.company]=byCo[m.company]||[]).push(m.name);
      });
      const cos=COMPANIES.filter(c=>byCo[c]);
      if(!cos.length) return '<div class="empty">まだ誰もログインしていません。</div>';
      const m2=c=>ownerMeta(c);
      return cos.map(c=>`<div style="margin-bottom:11px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:5px">${esc(c)}（${byCo[c].length}名）</div>
        <div class="row">${byCo[c].map(n=>`<span class="ownchip"><span class="ava" style="background:${m2(c).color}">${esc(m2(c).abbr)}</span>${esc(n)}</span>`).join('')}</div>
      </div>`).join('');
    })()}
    <p style="font-size:11.5px;color:var(--muted);margin-top:4px">社長様もスタッフの方も、どなたでもログインできます。新しい方が名前を入れてログインすると、自動でここに加わります。</p>
  </div></div>
  <div class="card"><h2>イベントを足す・直す</h2>
    ${evSorted().map(e=>`<div class="tk" style="border-left-color:${CAT[catOfEvent(e)].c}"><div class="tk-hd"><div class="tk-mid">
      <div class="tk-top">${catBadge(catOfEvent(e))}</div>
      <div class="tk-ttl">${esc(e.title)}</div>
      <div class="tk-meta"><span class="due">${(e.start||'').replace(/-/g,'/')}〜${(e.end||'').replace(/-/g,'/')}</span>
      ${ownChip(e.lead)}
      <button class="btn" data-delev="${e.id}" style="color:var(--red);padding:1px 8px;font-size:11px">消す</button></div>
    </div></div></div>`).join('')}
    <div class="body"><button class="btn btn-w" data-newev="1">＋ イベントを足す</button></div></div>
  <div class="card"><h2>最初の一回だけ</h2><div class="body">
    ${(S.events.length||S.tasks.length)
      ? `<p style="font-size:13px">✅ 初期データは投入済みです（イベント${S.events.length}件／ToDo${S.tasks.length}件）。<br>
          <span style="color:var(--muted)">二重登録を防ぐため、このボタンは使えなくなっています。</span></p>
         <button class="btn" disabled style="opacity:.45;cursor:default">議事録から初期データを入れる（投入済み）</button>`
      : `<p style="font-size:13px;margin-bottom:10px">理事会議事録（R8/7/23・R8/8/18）から起こしたイベント${SEED_EVENTS.length}件・ToDo${SEED_TASKS.length}件を入れます。</p>
         <button class="btn btn-p" id="do-seed">議事録から初期データを入れる</button>`}
    <span id="seed-msg" style="margin-left:10px;font-size:12.5px;color:var(--muted)"></span>
  </div></div>
  <div class="card"><h2>この画面について</h2><div class="body" style="font-size:12.5px;color:var(--muted)">
    <b style="color:var(--ink);font-size:14px">バージョン ${APP_VER}</b>（${APP_DATE}）<br>
    不具合や「表示が違う」ときは、この番号をお伝えください。<br><br>
    ${ONLINE?'✅ 共有サーバーにつながっています。編集は全員にすぐ反映されます。':'⚠ つながっていません。表示のみで、保存はできません。'}<br>
    イベント${S.events.length}件／ToDo${S.tasks.length}件／やりとり${S.comments.length}件
  </div></div>`;
}

/* ---------- イベント配線 ---------- */
function wire(){
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    S.openTask=b.dataset.jump; S.tab='task'; S.owner='all'; S.showDone=true;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='task'));
    render();
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    S.openTask = S.openTask===b.dataset.open ? null : b.dataset.open; render();
  });
  document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.done); if(!t) return;
    const to=b.checked?'done':'todo';
    saveTask(t.id,{status:to}, (b.checked?'✅ 完了にしました：':'↩ 未完了に戻しました：')+t.title);
  });
  document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.reopen);
    saveTask(t.id,{status:'doing'},'↩ 未完了に戻しました：'+t.title);
  });
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.claim); if(!t) return;
    saveTask(t.id,{owner:S.me.company,assignee:S.me.name,status:t.status==='done'?'done':'doing'},
      `🙋 ${S.me.company} ${S.me.name} さんが引き受けました：${t.title}`);
    addComment(t.id, `${S.me.company}の${S.me.name}です。こちら私が対応します。`);
  });
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.ask);
    const q=prompt('聞きたいことを書いてください（全員に見えます）',`「${t.title}」は今どうなっていますか？`);
    if(q) addComment(t.id,q);
  });
  document.querySelectorAll('[data-set]').forEach(el=>{
    const fire=()=>{
      const t=S.tasks.find(x=>x.id===el.dataset.id); if(!t) return;
      const f=el.dataset.set, v=el.value;
      if(String(t[f]||'')===String(v)) return;
      const labels={owner:'担当',assignee:'担当者名',status:'状態',due:'期限',eventId:'イベント',title:'やること',note:'メモ'};
      let disp=v||'（なし）';
      if(f==='status') disp=ST[v]; if(f==='eventId') disp=v?evName(v):'（未設定）';
      saveTask(t.id,{[f]:v}, `✏️ ${labels[f]}を「${String(disp).slice(0,30)}」に変更：${t.title}`);
    };
    if(el.tagName==='SELECT'||el.type==='date') el.onchange=fire; else el.onblur=fire;
  });
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.cm, inp=document.getElementById('cm-in-'+id);
    if(inp&&inp.value.trim()){ addComment(id,inp.value); inp.value=''; }
  });
  document.querySelectorAll('input[id^="cm-in-"]').forEach(i=>i.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ const id=i.id.replace('cm-in-',''); if(i.value.trim()){ addComment(id,i.value); i.value=''; } }
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.del);
    if(!confirm(`「${t.title}」を消します。よろしいですか？`)) return;
    col('tasks').doc(t.id).delete();
    log('🗑 ToDoを消しました：'+t.title); S.openTask=null;
  });
  document.querySelectorAll('[data-newtask]').forEach(b=>b.onclick=()=>sheetAddTask(b.dataset.newtask));
  document.querySelectorAll('[data-addflow]').forEach(b=>b.onclick=()=>sheetAddFlow(b.dataset.addflow));
  document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.line); if(!t) return;
    window.open(lineShareUrl(lineTaskText(t)), '_blank');
  });
  document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ev;
    const jumpTo=()=>{ const el=document.getElementById('ev-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    if(isMobile()) S.openEvent=id;   // スマホは該当イベントを開いた状態で見せる
    if(S.tab!=='time'){
      S.tab='time'; S.openTask=null;
      document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='time'));
      render();
      setTimeout(jumpTo,0);
    } else { render(); setTimeout(jumpTo,0); }
  });
  document.querySelectorAll('[data-goto-task]').forEach(b=>b.onclick=()=>{
    S.tab='task'; S.openTask=null;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='task'));
    render(); window.scrollTo(0,0);
  });
  // 担当の切替（予定・やること共通）
  document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{
    S.owner=b.dataset.owner; S.openTask=null; render();
  });
  // 完了の表示切替
  document.querySelectorAll('[data-toggledone]').forEach(b=>b.onclick=()=>{S.showDone=!S.showDone;render();});
  // 期限のかんたん指定（今日・明日・今週末…）
  document.querySelectorAll('[data-setdue]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.setdue, v=quickDate(b.dataset.d);
    const t=S.tasks.find(x=>x.id===id); if(!t) return;
    saveTask(id,{due:v}, `✏️ 期限を「${v||'なし'}」に変更：${t.title}`);
  });
  // かんばんの出し入れ
  document.querySelectorAll('[data-openboard]').forEach(b=>b.onclick=()=>{
    S.tab = b.dataset.openboard==='1' ? 'board' : 'task';
    S.openTask=null; render(); window.scrollTo(0,0);
  });
  // 注意帯：期限切れ／担当なしへ飛ぶ
  document.querySelectorAll('[data-warn]').forEach(b=>b.onclick=()=>{
    if(b.dataset.warn==='none') S.owner='none';
    S.tab='task'; S.showDone=false; S.openTask=null;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='task'));
    render(); window.scrollTo(0,0);
  });
  document.querySelectorAll('[data-agev]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.agev;
    S.openEvent = S.openEvent===id ? null : id;
    render();
    if(S.openEvent){ const el=document.getElementById('ev-'+id); if(el) el.scrollIntoView({block:'nearest'}); }
  });
  document.querySelectorAll('[data-cyc]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const t=S.tasks.find(x=>x.id===b.dataset.cyc); if(!t) return;
    const i=STATUS_ORDER.indexOf(t.status);
    const next=STATUS_ORDER[(i+1)%STATUS_ORDER.length];
    saveTask(t.id,{status:next}, `🔄 状態を「${ST[next]}」に変更：${t.title}`);
  });
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.mv); if(!t) return;
    const to=b.dataset.to;
    saveTask(t.id,{status:to}, `🔄 状態を「${ST[to]}」に変更：${t.title}`);
  });
  const nv=document.querySelector('[data-newev]'); if(nv) nv.onclick=sheetAddEvent;
  document.querySelectorAll('[data-delev]').forEach(b=>b.onclick=()=>{
    const e=evOf(b.dataset.delev);
    if(tasksOf(e.id).length){ alert('このイベントにはToDoが残っています。先にToDoを移すか消してください。'); return; }
    if(!confirm(`「${e.title}」を消します。よろしいですか？`)) return;
    col('events').doc(e.id).delete(); log('🗑 イベントを消しました：'+e.title);
  });
  const sb=$('#do-seed'); if(sb) sb.onclick=doSeed;
}

function doSeed(){
  if(!ONLINE){ alert('つながっていないため実行できません。'); return; }
  // 二重投入の事故防止：すでにデータがあるときは実行しない
  if(S.events.length || S.tasks.length){
    alert('すでにデータが入っています（イベント'+S.events.length+'件／ToDo'+S.tasks.length+'件）。\n二重登録を防ぐため、この操作は実行できません。');
    return;
  }
  if(!confirm('議事録から起こした初期データを入れます。実行しますか？')) return;
  const msg=$('#seed-msg'); msg.textContent='入れています…';
  const b=db.batch();
  SEED_EVENTS.forEach(e=>b.set(col('events').doc(e.id),
    {title:e.t,start:e.s,end:e.e,lead:e.lead,color:e.c,memo:e.memo}));
  SEED_TASKS.forEach((t,i)=>b.set(col('tasks').doc('sd'+String(i).padStart(3,'0')),
    {eventId:t.ev,title:t.t,owner:t.o,due:t.d,status:t.st,note:t.n,
     createdBy:'議事録より',createdAt:nowIso(),updatedBy:'議事録より',updatedAt:nowIso()}));
  b.commit().then(()=>{
    msg.textContent='入りました。［いま何がある］をご覧ください。';
    log('📥 議事録（R8/7/23・R8/8/18）から初期データを取り込みました');
  }).catch(err=>{ msg.textContent='失敗しました：'+err.message; });
}
</script>
</body>
</html>
