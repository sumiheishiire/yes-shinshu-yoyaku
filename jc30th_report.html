<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>30周年の集い 開催報告</title>
<meta name="description" content="1996年 日本JC全国会員大会主管 30周年の集い（2026年10月9日 ホテル国際21）の開催報告です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2b4b; --navy-mid:#12203c; --navy-deep:#0a1428;
    --gold:#c9a45c; --gold-lt:#e6cf9b; --gold-dp:#9c7a35;
    --paper:#f6f2ea; --ink:#1d242e; --muted:#7b7365;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  header{
    text-align:center;color:#fff;padding:48px 18px 36px;
    background:linear-gradient(168deg,var(--navy) 0%,var(--navy-mid) 58%,var(--navy-deep) 100%);
  }
  .kicker{font-size:12px;letter-spacing:.14em;color:var(--gold-lt);font-weight:700}
  .yr{font-family:"DM Serif Display",serif;font-size:clamp(22px,5.6vw,34px);color:var(--gold-lt);letter-spacing:.04em;margin:14px 0 4px}
  h1{font-family:"Noto Serif JP",serif;font-weight:900;font-size:clamp(26px,6.4vw,44px);line-height:1.35;margin:6px 0 10px}
  h1 small{display:block;font-size:.4em;color:var(--gold-lt);letter-spacing:.12em;font-weight:700;margin-bottom:6px}
  .date{font-size:13px;opacity:.9;font-weight:500;line-height:1.9}
  main{max-width:1100px;margin:0 auto;padding:28px 14px 48px}
  .photo{margin:0;background:#fffdf9;border:1px solid #e6ddcb;border-radius:6px;padding:10px;box-shadow:0 14px 36px rgba(12,24,44,.13)}
  .photo img{display:block;width:100%;height:auto;border-radius:3px}
  .photo figcaption{text-align:center;font-family:"Noto Serif JP",serif;font-weight:700;font-size:14px;color:var(--navy);padding:12px 6px 4px}
  .msg{max-width:680px;margin:28px auto 0;text-align:center;font-size:14px;line-height:2.05;font-weight:500;color:#3c4551}
  .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
  .btn{display:inline-block;text-decoration:none;font-weight:900;font-size:14px;padding:13px 22px;border-radius:4px;border:1px solid var(--gold-dp);
    background:var(--navy);color:#fff}
  .btn.ghost{background:transparent;color:var(--navy)}
  .note{max-width:680px;margin:26px auto 0;font-size:12px;color:var(--muted);font-weight:600;line-height:1.95;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 18px 36px;line-height:2}
  footer a{color:var(--navy);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="kicker">1996年度 社団法人 長野青年会議所</div>
  <div class="yr">1996 — 2026</div>
  <h1><small>開催報告</small>30周年の集い</h1>
  <div class="date">2026年10月9日（金）　ホテル国際21（旧HQホテル）</div>
</header>

<main>
  <figure class="photo">
    <a href="jc30th_report.jpg" aria-label="写真を原寸で開く">
      <img src="jc30th_report.jpg" width="2000" height="1125" alt="30周年の集いの集合写真。参加メンバーが前列に座り、後列に立って笑顔で写っている">
    </a>
    <figcaption>あの日から30年、もう一度。みなさん、ありがとうございました。</figcaption>
  </figure>

  <p class="msg">
    ご参加いただいたみなさま、ありがとうございました。<br>
    当日の集合写真をお届けします。写真をタップすると原寸で開き、保存もできます。
  </p>
  <div class="btns">
    <a class="btn" href="jc30th_report.jpg" download="jc30th_30周年の集い_集合写真.jpg">⬇️ 写真を保存する</a>
    <a class="btn ghost" href="jc30th.html">30周年の集い 案内ページへ</a>
  </div>
  <p class="note">
    このページは参加メンバーへのご案内用です。URLの転送や、SNSなどへの公開はご遠慮ください。<br>
    写真の掲載を外してほしい方は、幹事までご連絡ください。
  </p>
</main>

<footer>1996年 日本JC全国会員大会主管　30周年の集い</footer>
</body>
</html>
