<style>
:root{
  --paper:#f4f1ea; --paper2:#fffdf8; --line:#ddd6c7; --line2:#c8bfab;
  --ink:#22201c; --ink2:#5c574d; --ink3:#8b8477;
  --red:#b23a26; --blue:#2f4858; --green:#4a7a52;
  --amber:#a3762a; --gray:#9a948a; --purple:#7b5ea7;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -14px rgba(40,35,25,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Zen Kaku Gothic New','Yu Gothic UI','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ── 解錠ゲート ── */
.gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;
  align-items:center;justify-content:center;padding:24px}
.gate.hide{display:none}
.gbox{width:min(400px,100%);text-align:center}
.gmark{width:44px;height:44px;margin:0 auto 18px;position:relative}
.gmark::before{content:"";position:absolute;left:0;top:0;width:9px;height:44px;background:var(--red)}
.gmark::after{content:"";position:absolute;left:16px;top:6px;width:28px;height:6px;background:var(--ink);
  box-shadow:0 13px 0 var(--ink), 0 26px 0 var(--ink)}
.gbox h1{font-family:'Zen Old Mincho',serif;font-size:1.35rem;letter-spacing:.1em;margin-bottom:6px}
.gbox p{font-size:.8rem;color:var(--ink2);margin-bottom:20px;line-height:1.8}
.gbox input{width:100%;padding:11px 14px;background:var(--paper2);border:1px solid var(--line2);
  border-radius:3px;font-size:1rem;text-align:center;letter-spacing:.1em}
.gbox input:focus{outline:none;border-color:var(--blue);background:#fff}
.gbox button{width:100%;margin-top:10px;padding:11px;background:var(--ink);color:var(--paper2);
  border:none;border-radius:3px;font-size:.9rem;font-weight:500;cursor:pointer}
.gbox button:hover{background:#000}
.gerr{color:var(--red);font-size:.78rem;margin-top:10px;min-height:1.2em}
.gsub{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink3);line-height:1.8}
.gsub button{background:none;border:1px solid var(--line2);color:var(--ink2);width:auto;
  padding:6px 14px;font-size:.76rem;margin-top:8px;border-radius:3px}
.gsub button:hover{background:var(--paper2);color:var(--ink)}

/* ── ヘッダー ── */
.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;
}
.brand{font-family:'Zen Old Mincho',serif;font-size:1.15rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px}
.brand em{font-family:'Zen Kaku Gothic New',sans-serif;font-style:normal;font-size:.72rem;font-weight:400;color:var(--ink3);letter-spacing:.02em}
.brand::before{content:"";display:inline-block;width:5px;height:20px;background:var(--red);margin-right:2px;transform:translateY(3px)}
.top-sp{flex:1}
.count{font-size:.74rem;color:var(--ink2);white-space:nowrap}
.count b{font-size:1rem;font-family:'Zen Old Mincho',serif}
.sync{font-size:.7rem;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--gray);flex-shrink:0}
.sdot.ok{background:var(--green)} .sdot.busy{background:var(--amber);animation:pl .8s infinite}
.sdot.off{background:var(--gray)} .sdot.err{background:var(--red)}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.search{position:relative}
.search input{
  width:250px;padding:7px 11px 7px 30px;background:var(--paper2);
  border:1px solid var(--line2);border-radius:3px;font-size:.82rem;
}
.search input:focus{outline:none;border-color:var(--blue)}
.search::before{content:"\2315";position:absolute;left:10px;top:50%;transform:translateY(-52%);color:var(--ink3);font-size:.95rem}
.tbtn{
  padding:7px 13px;background:var(--paper2);border:1px solid var(--line2);
  border-radius:3px;cursor:pointer;font-size:.78rem;white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink2);background:#fff}
.tbtn.pri{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.tbtn.pri:hover{background:#000}

/* ── レイアウト ── */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
aside{
  width:212px;flex-shrink:0;padding:18px 16px 60px;border-right:1px solid var(--line);
  position:sticky;top:58px;max-height:calc(100vh - 58px);overflow-y:auto;
}
aside h3{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--ink3);margin:20px 0 7px}
aside h3:first-child{margin-top:0}
.fl{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:4px 8px;border-radius:3px;font-size:.82rem;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.fl:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.fl.on{background:var(--ink);color:var(--paper2);font-weight:500}
.fl.on span{color:rgba(255,255,255,.6)}
.fl span{color:var(--ink3);font-size:.72rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:var(--paper2);border-radius:100px;
  padding:2px 9px;font-size:.72rem;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{flex:1;min-width:0;padding:12px 16px 70px}

/* ── 行 ── */
.grp{margin-bottom:14px}
.grp-h{font-size:.7rem;letter-spacing:.12em;color:var(--ink3);font-weight:700;
  padding:0 0 4px 2px;border-bottom:1px solid var(--line);margin-bottom:7px}
.row{
  display:flex;background:var(--paper2);border:1px solid var(--line);
  border-radius:4px;margin-bottom:6px;cursor:pointer;transition:border-color .12s, box-shadow .12s;
  overflow:hidden;
}
.row:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.bar{width:4px;flex-shrink:0;background:var(--gray)}
.bar.s1{background:var(--green)} .bar.s2{background:var(--amber)}
.bar.s3{background:var(--gray)} .bar.s4{background:var(--red)} .bar.s5{background:var(--purple)}
.bar.s6{background:var(--blue)}
.bar.s7{background:#c9c2b4}

/* 没：見えてはいるが主役ではない、という濃さにする */
.row.dropped,.tile.dropped{opacity:.55}
.row.dropped:hover,.tile.dropped:hover{opacity:1}
.row.dropped .ttl,.tile.dropped .tname{text-decoration:line-through;text-decoration-color:#c0b8a8}
.rb{flex:1;min-width:0;padding:9px 12px}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.ttl{font-weight:700;font-size:.92rem;letter-spacing:.01em}
.badge{font-size:.66rem;padding:1px 7px;border-radius:2px;border:1px solid;white-space:nowrap;letter-spacing:.04em}
.b1{color:var(--green);border-color:var(--green)} .b2{color:var(--amber);border-color:var(--amber)}
.b3{color:var(--gray);border-color:var(--gray)} .b4{color:var(--red);border-color:var(--red)}
.b5{color:var(--purple);border-color:var(--purple)}
.b6{color:#fff;background:var(--blue);border-color:var(--blue)}
.b7{color:#8d8579;border-color:#cdc6b8;background:#efeadf}
.drop{position:fixed;inset:0;z-index:120;background:rgba(47,72,88,.9);color:#fff;display:none;
  align-items:center;justify-content:center;font-size:1.05rem;letter-spacing:.06em;text-align:center;padding:30px}
.drop.on{display:flex}
.tg{font-size:.68rem;color:var(--ink3)}
.tg i{font-style:normal}
.l2{font-size:.8rem;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.l3{font-size:.7rem;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.l3 .u{font-family:ui-monospace,Menlo,monospace;font-size:.68rem}
.thumb{width:104px;flex-shrink:0;border-left:1px solid var(--line);background:#efeadf;
  background-size:cover;background-position:top center;display:flex;align-items:center;justify-content:center;
  font-size:.62rem;color:var(--ink3);text-align:center;line-height:1.3;padding:4px}
.acts{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 9px;border-left:1px solid var(--line)}
.ico{width:28px;height:26px;border:1px solid var(--line2);background:var(--paper2);border-radius:3px;
  cursor:pointer;font-size:.74rem;display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none}
.ico:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.ico.dis{opacity:.28;pointer-events:none}
.empty{padding:60px 0;text-align:center;color:var(--ink3);font-size:.85rem;line-height:2}

/* ── タイル表示 ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:7px}
.tile{background:var(--paper2);border:1px solid var(--line);border-radius:4px;overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;position:relative;
  transition:border-color .12s,box-shadow .12s,transform .1s}
.tile:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-1px)}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gray);z-index:2}
.tile.s1::before{background:var(--green)} .tile.s2::before{background:var(--amber)}
.tile.s3::before{background:var(--gray)}  .tile.s4::before{background:var(--red)}
.tile.s5::before{background:var(--purple)} .tile.s6::before{background:var(--blue)}
.tile.s7::before{background:#c9c2b4}
.tmb{aspect-ratio:16/9;background-size:cover;background-position:top center;position:relative;
  border-bottom:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;overflow:hidden}
.tmb .ini{font-family:'Zen Old Mincho',serif;font-size:1.25rem;font-weight:700;line-height:1;opacity:.85}
.tmb .svc{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75;
  padding:1px 6px;border-radius:100px;border:1px solid currentColor}
.tmb.has{background-color:#efeadf}
.tbody{padding:6px 8px 7px;display:flex;flex-direction:column;gap:2px;flex:1}
.tname{font-weight:700;font-size:.75rem;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tmeta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:2px}
.tbadge{font-size:.6rem;padding:0 5px;border-radius:2px;border:1px solid;white-space:nowrap}
.thost{font-family:ui-monospace,Menlo,monospace;font-size:.6rem;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.towner{font-size:.6rem;color:var(--red)}
.tacts{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .12s;z-index:3}
.tile:hover .tacts{opacity:1}
.tacts a,.tacts button{width:24px;height:22px;border:1px solid var(--line2);background:rgba(255,253,248,.94);
  border-radius:3px;cursor:pointer;font-size:.66rem;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);text-decoration:none;padding:0}
.tacts a:hover,.tacts button:hover{border-color:var(--ink);color:var(--ink);background:#fff}
@media(hover:none){ .tacts{opacity:1} }

/* ── ドロワー ── */
.scrim{position:fixed;inset:0;background:rgba(30,26,18,.34);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--paper2);
  border-left:1px solid var(--line2);z-index:61;transform:translateX(102%);transition:transform .22s cubic-bezier(.3,.8,.4,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)
}
.drawer.on{transform:none}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:1.08rem;line-height:1.4;flex:1}
.dclose{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink3);line-height:1;padding:2px 4px}
.dclose:hover{color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:16px 20px 40px}
.urlbox{display:flex;gap:6px;margin-bottom:16px}
.urlbox code{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;word-break:break-all;color:var(--blue)}
.sec{margin-bottom:18px}
.sec h4{font-size:.68rem;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:6px;
  padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec ul{list-style:none;font-size:.85rem}
.sec ul li{padding:4px 0 4px 16px;position:relative;color:var(--ink)}
.sec ul li::before{content:"\2014";position:absolute;left:0;color:var(--line2)}
.kv{display:grid;grid-template-columns:82px 1fr;gap:4px 12px;font-size:.8rem}
.kv dt{color:var(--ink3);font-size:.74rem;padding-top:2px}
.kv dd{color:var(--ink);word-break:break-all}
.kv dd.mono{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--ink2)}
.shot{width:100%;border:1px dashed var(--line2);border-radius:4px;background:var(--paper);
  min-height:110px;display:flex;align-items:center;justify-content:center;color:var(--ink3);
  font-size:.76rem;text-align:center;padding:14px;cursor:pointer;overflow:hidden}
.shot img{width:100%;display:block;border-radius:3px}
.note{background:#fdf6e3;border:1px solid #e8d9a8;border-radius:3px;padding:9px 12px;font-size:.8rem;color:#6b5518}

/* ── モーダル ── */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;background:rgba(30,26,18,.4)}
.modal.on{display:flex}
.mbox{background:var(--paper2);border:1px solid var(--line2);border-radius:5px;width:min(580px,100%);padding:22px}
.mbox h3{font-family:'Zen Old Mincho',serif;font-size:1.05rem;margin-bottom:16px}
.f{margin-bottom:12px}
.f label{display:block;font-size:.72rem;color:var(--ink3);margin-bottom:3px;letter-spacing:.06em}
.f input,.f textarea,.f select{width:100%;padding:7px 10px;background:var(--paper);border:1px solid var(--line2);border-radius:3px;font-size:.84rem}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--blue);background:#fff}
.f textarea{resize:vertical;min-height:62px;line-height:1.6}
.f .hint{font-size:.68rem;color:var(--ink3);margin-top:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.mact .del{margin-right:auto;color:var(--red);border-color:#e0bdb4}
.lbox{position:fixed;inset:0;z-index:150;background:rgba(30,26,18,.86);display:none;
  align-items:flex-start;justify-content:center;overflow:auto;padding:24px;cursor:zoom-out}
.lbox.on{display:flex}
.lbox img{max-width:min(1100px,96vw);width:100%;height:auto;border-radius:4px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.8);image-rendering:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:var(--paper2);padding:9px 20px;border-radius:3px;font-size:.8rem;z-index:90;opacity:0;
  pointer-events:none;transition:all .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ── スマホ ── */
#btnFilter{display:none}
@media(max-width:820px){
  body{font-size:15px}
  .top{padding:9px 12px;gap:8px;row-gap:8px}
  .brand{font-size:1rem;order:1}
  .brand em{display:none}
  #btnFilter{display:block;order:2;margin-left:auto}
  #btnAdd{order:3}
  .count{order:4}
  .sync{order:5;margin-left:auto}
  .search{order:6;flex:1 1 100%}
  .search input{width:100%}
  #sort{order:7;flex:1}
  #btnExp,#btnImp{order:8;font-size:.72rem;padding:7px 9px}
  .top-sp{display:none}

  .layout{display:block}
  aside{
    position:fixed;top:0;left:0;bottom:0;width:270px;max-height:none;z-index:65;
    background:var(--paper2);border-right:1px solid var(--line2);padding:16px 16px 60px;
    transform:translateX(-102%);transition:transform .2s cubic-bezier(.3,.8,.4,1);
    box-shadow:20px 0 50px -30px rgba(0,0,0,.5);
  }
  aside.open{transform:none}
  main{padding:10px 12px 90px}

  .thumb{width:76px}
  .rb{padding:10px 11px}
  .ttl{font-size:.95rem}
  .l2{-webkit-line-clamp:3}
  .acts{padding:0 7px}
  .ico{width:36px;height:34px;font-size:.9rem}
  .drawer{width:100%}
  .dbody{padding:14px 16px 60px}
  .kv{grid-template-columns:74px 1fr}
  .f2{grid-template-columns:1fr}
  .mbox{padding:16px}
  .modal{padding:12px}
}
@media(max-width:420px){ .thumb{display:none} }

/* ── タブ ── */
.tabs{position:sticky;top:58px;z-index:38;background:var(--paper);
  border-bottom:1px solid var(--line2);display:flex;gap:2px;padding:0 20px;overflow-x:auto}
.tb{background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
  padding:9px 15px 8px;font-size:.88rem;font-weight:700;color:var(--ink3);
  white-space:nowrap;letter-spacing:.03em}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--ink);border-bottom-color:var(--red)}
.tb span{font-size:.7rem;font-weight:400;color:var(--ink3);margin-left:5px;font-variant-numeric:tabular-nums}
.tabpane.hide{display:none}
#tab-ledger aside{top:96px;max-height:calc(100vh - 96px)}
.pane{padding:16px 20px 80px;max-width:1220px}
.pane h3{font-family:'Zen Old Mincho',serif;font-size:1rem;margin:22px 0 8px;
  padding-bottom:5px;border-bottom:1px solid var(--line2)}
.pane h3:first-child{margin-top:0}
.lead{font-size:.82rem;color:var(--ink2);line-height:1.85;margin-bottom:14px}
.warn{background:#fdf6e3;border:1px solid #e8d9a8;border-radius:3px;padding:9px 13px;
  font-size:.8rem;color:#6b5518;line-height:1.75;margin-bottom:14px}

/* ── 入力表 ── */
.rtw{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper2)}
table.rt{border-collapse:collapse;width:100%;font-size:.84rem}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap}
table.rt th{background:var(--paper);font-size:.7rem;color:var(--ink2);font-weight:700;letter-spacing:.03em;line-height:1.35}
table.rt td.l,table.rt th.l{text-align:left}
table.rt td.l{white-space:normal}
table.rt td.l .mut{display:block;margin-top:2px;line-height:1.55;white-space:normal}
/* 設定表は「項目名＋補足」が長いので、ラベル列に幅を与えて横スクロールを出さない */

<script>
/* ==================================================================
   URL台帳
   ------------------------------------------------------------------
   ・データはこのファイルに入っていない。合言葉から作った鍵で
     AES-GCM暗号化し、Firestoreに置いてある。
     → 公開URLを踏まれても、合言葉が無ければ中身は読めない。
   ・端末間の同期は項目単位（新しいタイムスタンプが勝つ）。
   ・鍵は端末のlocalStorageに残るので、解錠は端末ごとに1回だけ。
   ・初期データの投入：合言葉を決めて「読み込み」で
     URL台帳_seed.json を取り込む。以後はクラウドが正。
   ================================================================== */

/* ── 設定 ── */
var FB={
  apiKey:"AIzaSyCpoyVws1Z5T_BrNHExi2SbY0oarmgXKeg",
  authDomain:"yes-shinsyupj.firebaseapp.com",
  projectId:"yes-shinsyupj",
  storageBucket:"yes-shinsyupj.firebasestorage.app",
  messagingSenderId:"664348645067",
  appId:"1:664348645067:web:5cd634d0736da0f7dd6d4e"
};
var APP='url-ledger';
var STATE_PATH=['artifacts',APP,'public','data','state','main'];
var SHOTS_PATH=['artifacts',APP,'public','data','shots'];
var INBOX_PATH=['artifacts',APP,'public','data','inbox','latest'];
var LSINBOX='url_ledger_inbox_ts';
var SALT='url-ledger/2026-09/sumihei';
var LS='url_ledger_v2';
var LSKEY='url_ledger_key_v2';

var STATUS=[
  {k:'未整理',   c:'s6', b:'b6'},   /* 自動検出したばかりで、まだ説明を書いていないもの */
  {k:'運用中',   c:'s1', b:'b1'},
  {k:'期間終了', c:'s2', b:'b2'},
  {k:'旧版',     c:'s3', b:'b3'},
  {k:'停止中',   c:'s4', b:'b4'},
  {k:'URL未確認',c:'s5', b:'b5'},
  {k:'没',       c:'s7', b:'b7'}    /* 作ったが採用されなかったもの。既定では表示しない */
];

/* 手元だけのHTMLか。local:true か、URLが無くてパスがあるもの */
function isLocal(it){ return it.local===true; }
function placeOf(it){ return isLocal(it) ? '手元のHTML' : '公開URL'; }

/* 没かどうか。状態が「没」でも、タグに「没」と書いても同じ扱いにする */
function isDropped(it){
  return it.status==='没' || (it.tags||[]).indexOf('没')>=0;
}

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}
function now(){return Date.now();}
/* 日付は必ず日本時間で。端末のタイムゾーンや UTC 変換で月がずれないようにする */
function jstDate(){ var d=new Date(); return new Date(d.getTime()+(9*60+d.getTimezoneOffset())*60000); }
function pad2(n){ return (n<10?'0':'')+n; }
function ymJST(){ var d=jstDate(); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function ymdJST(){ return ymJST()+'-'+pad2(jstDate().getDate()); }

/* ── 暗号（AES-GCM / PBKDF2） ── */
var CK=null;
var b64=function(buf){var b='',a=new Uint8Array(buf);
  for(var i=0;i<a.length;i++) b+=String.fromCharCode(a[i]); return btoa(b);};
var unb64=function(s){var b=atob(s),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a;};

async function deriveKey(pass){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:enc.encode(SALT),iterations:150000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function encryptBytes(u8){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CK,u8);
  var out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
  return b64(out);
}
async function decryptBytes(blob){
  var raw=unb64(blob);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},CK,raw.slice(12));
  return new Uint8Array(pt);
}
async function encrypt(text){ return encryptBytes(new TextEncoder().encode(text)); }
async function decrypt(blob){ return new TextDecoder().decode(await decryptBytes(blob)); }

/* ── 圧縮 ──
   台帳本文はFirestoreの1ドキュメント上限(1MB)に収める必要がある。
   無圧縮だと約1,270件で頭打ちだが、gzipすると17%まで縮んで約7,600件まで持つ。
   CompressionStreamが無い環境では無圧縮で書き、gzフラグで見分ける。 */
function hasGz(){ return typeof CompressionStream!=='undefined' && typeof DecompressionStream!=='undefined'; }
async function gzip(text){
  var cs=new CompressionStream('gzip');
  var w=cs.writable.getWriter(); w.write(new TextEncoder().encode(text)); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function gunzip(u8){
  var ds=new DecompressionStream('gzip');
  var w=ds.writable.getWriter(); w.write(u8); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
async function saveKey(){ var raw=await crypto.subtle.exportKey('raw',CK);
  try{ localStorage.setItem(LSKEY,b64(raw)); }catch(e){} }
async function loadKey(){
  var s=null; try{ s=localStorage.getItem(LSKEY); }catch(e){}
  if(!s) return false;
  CK=await crypto.subtle.importKey('raw',unb64(s),{name:'AES-GCM'},true,['encrypt','decrypt']);
  return true;
}

/* ── 手元の保管 ──────────────────────────────────────────────
   台帳の本体(items)と画像(shots)は別々の場所に置く。
   localStorage は 5MB しかなく、画像を同じ場所に入れると
   「画像が一杯になったせいで台帳本文が保存できない」事故になる。
   ・items  → localStorage（168件で全体の3%。軽い）
   ・shots  → IndexedDB（上限は桁違いに大きい。溢れても本文は無事）
   ------------------------------------------------------------- */
var db={items:[],shots:{}};   /* items: [{...,_ts,_del?}]  shots:{id:{d:dataURL,_ts}} */

var IDB=null;
function idbOpen(){
  return new Promise(function(res){
    if(IDB) return res(IDB);
    if(!window.indexedDB) return res(null);
    var rq=indexedDB.open('url-ledger',1);
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('shots')) d.createObjectStore('shots',{keyPath:'id'});
    };
    rq.onsuccess=function(e){ IDB=e.target.result; res(IDB); };
    rq.onerror=function(){ res(null); };
  });
}
function idbAll(){
  return new Promise(function(res){
    if(!IDB) return res([]);
    try{
      var tx=IDB.transaction('shots','readonly').objectStore('shots').getAll();
      tx.onsuccess=function(){ res(tx.result||[]); };
      tx.onerror=function(){ res([]); };
    }catch(e){ res([]); }
  });
}
function idbPut(id,rec){
  return new Promise(function(res){
    if(!IDB) return res(false);
    try{
      var tx=IDB.transaction('shots','readwrite').objectStore('shots')
              .put({id:id,d:rec.d,_ts:rec._ts});
      tx.onsuccess=function(){ res(true); };
      tx.onerror=function(){ res(false); };
    }catch(e){ res(false); }
  });
}
function idbDel(id){
  return new Promise(function(res){
    if(!IDB) return res(false);
    try{
      var tx=IDB.transaction('shots','readwrite').objectStore('shots').delete(id);
      tx.onsuccess=function(){ res(true); };
      tx.onerror=function(){ res(false); };
    }catch(e){ res(false); }
  });
}

async function loadLocal(){
  var legacyShots=null;
  try{
    var r=localStorage.getItem(LS);
    if(r){ var p=JSON.parse(r);
      db.items=p.items||[];
      if(p.shots && Object.keys(p.shots).length) legacyShots=p.shots;  /* 旧版からの移行 */
    }
  }catch(e){}

  await idbOpen();
  var rows=await idbAll();
  rows.forEach(function(r){ db.shots[r.id]={d:r.d,_ts:r._ts}; });

  if(legacyShots){                       /* localStorage に残っていた画像を IndexedDB へ移す */
    var ks=Object.keys(legacyShots), moved=0;
    for(var i=0;i<ks.length;i++){
      var k=ks[i], v=legacyShots[k];
      if(!db.shots[k]){ db.shots[k]=v; }
      if(await idbPut(k,db.shots[k])) moved++;
    }
    saveLocal();                          /* 画像抜きで書き直す＝localStorageが一気に空く */
    if(moved) console.info('画像 '+moved+' 枚を IndexedDB へ移行しました');
  }
}

/* 本文だけを localStorage に。画像は入れない */
function saveLocal(){
  try{ localStorage.setItem(LS,JSON.stringify({items:db.items})); }
  catch(e){ toast('台帳の保存に失敗しました（端末の空き容量を確認してください）'); }
}
/* 画像は1枚ずつ IndexedDB へ */
async function saveShotLocal(id){
  if(db.shots[id]) { if(!await idbPut(id,db.shots[id])) toast('画像を端末に保存できませんでした'); }
  else await idbDel(id);
}
/* 台帳の一覧・件数・絞り込みに出す行。
   _kind を持つ行（設定・稼働ログ・月次スナップショット）は台帳の中身ではないので除く。 */
function live(){ return db.items.filter(function(i){return !i._del && !i._kind;}); }
/* 書き出し・同期の対象。こちらは _kind の行も含める（設定ごとバックアップしたいので）。
   _kind の行には _del も立てている（下の sysGet のコメント参照）ので、
   _del だけで弾かずに _kind を先に拾う。 */
function allLive(){ return db.items.filter(function(i){return !i._del || !!i._kind;}); }
function byId(id){ for(var i=0;i<db.items.length;i++){ if(db.items[i].id===id) return db.items[i]; } return null; }

/* 項目単位のマージ：新しい_tsが勝つ */
function mergeItems(remote){
  var map={},changed=false;
  db.items.forEach(function(i){map[i.id]=i;});
  (remote||[]).forEach(function(r){
    var l=map[r.id];
    if(!l){ map[r.id]=r; changed=true; }
    else if((r._ts||0)>(l._ts||0)){ map[r.id]=r; changed=true; }
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  var localNewer=arr.some(function(a){
    var r=(remote||[]).filter(function(x){return x.id===a.id;})[0];
    return !r || (a._ts||0)>(r._ts||0);
  });
  db.items=arr;
  return {changed:changed, push:localNewer};
}

/* ── クラウド ── */
var cloud={ready:false,fs:null,db:null,state:null,shots:null};
function setSync(cls,txt){ $('sdot').className='sdot '+cls; $('stxt').textContent=txt; }

async function initCloud(){
  if(cloud.ready) return true;
  if(location.protocol==='file:'){ setSync('off','この端末のみ'); return false; }
  try{
    setSync('busy','接続中');
    var m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var au=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    var fs=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    var app=m.initializeApp(FB);
    await au.signInAnonymously(au.getAuth(app));
    cloud.fs=fs; cloud.db=fs.getFirestore(app);
    cloud.state=fs.doc.apply(null,[cloud.db].concat(STATE_PATH));
    cloud.shots=fs.collection.apply(null,[cloud.db].concat(SHOTS_PATH));
    cloud.ready=true;
    return true;
  }catch(e){ console.warn(e); setSync('err','未接続'); return false; }
}

async function pullCloud(){
  if(!cloud.ready) return {exists:false};
  var snap=await cloud.fs.getDoc(cloud.state);
  if(!snap.exists()) return {exists:false};
  var d=snap.data();
  var json;
  if(d.gz){ json=await gunzip(await decryptBytes(d.blob)); }  /* 合言葉が違えばここで例外 */
  else    { json=await decrypt(d.blob); }
  var p=JSON.parse(json);
  return {exists:true, items:p.items||[], shotIdx:p.shotIdx||null};
}
var pushT=null;
function schedulePush(){ if(!cloud.ready) return; clearTimeout(pushT); pushT=setTimeout(pushCloud,900); }
async function pushCloud(){
  if(!cloud.ready) return;
  try{
    setSync('busy','保存中');
    /* 画像の索引も一緒に入れる。これがあると次回の起動で
       画像コレクション全部を読まずに済む（150件なら150回→1回） */
    var idx={}; Object.keys(db.shots).forEach(function(k){ idx[k]=db.shots[k]._ts||0; });
    var text=JSON.stringify({items:db.items, shotIdx:idx});
    var rec;
    if(hasGz()){ rec={blob:await encryptBytes(await gzip(text)), gz:true}; }
    else       { rec={blob:await encrypt(text), gz:false}; }
    rec.updatedAt=now(); rec.n=db.items.length;
    await cloud.fs.setDoc(cloud.state,rec);
    if(rec.blob.length>800000) toast('台帳が大きくなっています。不要な行の整理をおすすめします');
    setSync('ok','同期済み');
  }catch(e){ console.warn(e); setSync('err','保存できず'); }
}
/* ── 受信箱 ──
   PC側の sync_ledger.ps1 が、走査した候補を暗号化してここに置く。
   台帳を開くたびに覗いて、まだ台帳に無い行だけを「未整理」で足す。
   既にある行は id が一致しても絶対に触らない（手で書いた説明を守るため）。 */
async function pullInbox(){
  if(!cloud.ready) return 0;
  try{
    var ref=cloud.fs.doc.apply(null,[cloud.db].concat(INBOX_PATH));
    var snap=await cloud.fs.getDoc(ref);
    if(!snap.exists()) return 0;
    var d=snap.data();
    var stamp=Number(d.updatedAt||0);
    var seen=0; try{ seen=Number(localStorage.getItem(LSINBOX)||0); }catch(e){}
    if(stamp<=seen) return 0;                      /* もう取り込んだ分 */
    var json = d.gz ? await gunzip(await decryptBytes(d.blob)) : await decrypt(d.blob);
    var arr=(JSON.parse(json).items)||[];
    var add=0, t=now();
    arr.forEach(function(it){
      if(!it||!it.id||!it.name) return;
      if(byId(it.id)) return;                      /* 既存は据え置き */
      it._ts=it._ts||t;
      db.items.push(it); add++;
    });
    try{ localStorage.setItem(LSINBOX,String(stamp)); }catch(e){}
    if(add){ saveLocal(); render(); schedulePush();
      toast('自動検出で '+add+' 件が「未整理」に入りました'); }
    return add;
  }catch(e){ console.warn(e); return 0; }
}

/* 画像の取得。索引(shotIdx)があるときは「手元に無い／古い」ものだけ個別に取る。
   索引が無い＝旧版が書いたデータのときだけ、従来どおり全件読みにフォールバックする。 */
async function pullShots(shotIdx){
  if(!cloud.ready) return;
  try{
    var n=0, i;
    if(shotIdx){
      var need=Object.keys(shotIdx).filter(function(k){
        var l=db.shots[k]; return !l || (l._ts||0)<(shotIdx[k]||0);
      });
      if(!need.length) return;
      setSync('busy','画像取得中 0/'+need.length);
      for(i=0;i<need.length;i++){
        try{
          var ref=cloud.fs.doc.apply(null,[cloud.db].concat(SHOTS_PATH,[need[i]]));
          var sp=await cloud.fs.getDoc(ref);
          if(!sp.exists()) continue;
          var sd=sp.data();
          db.shots[need[i]]={d:await decrypt(sd.blob),_ts:sd.updatedAt||0};
          await saveShotLocal(need[i]); n++;
        }catch(e){}
        if(i%10===9) setSync('busy','画像取得中 '+(i+1)+'/'+need.length);
      }
    }else{
      var qs=await cloud.fs.getDocs(cloud.shots);
      for(i=0;i<qs.docs.length;i++){
        var doc=qs.docs[i], d=doc.data();
        var l=db.shots[doc.id];
        if(l && (l._ts||0)>=(d.updatedAt||0)) continue;
        try{ db.shots[doc.id]={d:await decrypt(d.blob),_ts:d.updatedAt||0};
             await saveShotLocal(doc.id); n++; }catch(e){}
      }
    }
    if(n){ render(); }
    setSync('ok','同期済み');
  }catch(e){ console.warn(e); }
}
async function pushShot(id){
  if(!cloud.ready) return;
  var s=db.shots[id];
  try{
    if(!s){ await cloud.fs.deleteDoc(cloud.fs.doc.apply(null,[cloud.db].concat(SHOTS_PATH,[id]))); return; }
    var blob=await encrypt(s.d);
    await cloud.fs.setDoc(cloud.fs.doc.apply(null,[cloud.db].concat(SHOTS_PATH,[id])),
      {blob:blob,updatedAt:s._ts});
  }catch(e){ console.warn(e); toast('画像をクラウドに送れませんでした'); }
}

async function unlock(){

  $('gErr').textContent='';

var st={q:'',cat:'',status:'',owner:'',place:'',tags:[],sort:'upd',view:'tile'};

/* ── サービス名と色 ──
   スクショが無くても一目で見分けられるように、ホストからサービス名と色を作る。
   同じホストは同じ色になるので、ポータル配下のツールが視覚的にまとまる。 */
var SVC=[
  [/azurestaticapps\.net$/,'Azure SWA'], [/azurewebsites\.net$/,'App Service'],
  [/github\.io$/,'GitHub Pages'],        [/pages\.dev$/,'CF Pages'],
  [/workers\.dev$/,'CF Workers'],        [/pythonanywhere\.com$/,'PythonAnywhere'],
  [/netlify\.app$/,'Netlify'],           [/vercel\.app$/,'Vercel']
];
function hashOf(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function visual(it){
  if(isLocal(it)){
    var top=(it.source||'').split(String.fromCharCode(92))[0].replace(/^\d\d_/,'')||'デスクトップ';
    var hu=hashOf(top)%360;
    return {svc:top, bg:'hsl('+hu+' 18% 88%)', fg:'hsl('+hu+' 30% 32%)', ini:(it.name||'?').charAt(0)};
  }
  if(!it.url) return {svc:'URL未発行',bg:'#eae5da',fg:'#7a7367',ini:(it.name||'?').charAt(0)};
  var hostname='';
  try{ hostname=new URL(it.url).host.toLowerCase(); }catch(e){ hostname=it.url; }
  var svc=hostname;
  for(var i=0;i<SVC.length;i++){ if(SVC[i][0].test(hostname)){ svc=SVC[i][1]; break; } }
  var hue=hashOf(hostname)%360;
  return {svc:svc, bg:'hsl('+hue+' 30% 87%)', fg:'hsl('+hue+' 42% 27%)', ini:(it.name||'?').charAt(0)};
}
function statusOf(k){for(var i=0;i<STATUS.length;i++){if(STATUS[i].k===k)return STATUS[i];}return STATUS[4];}
function host(u){ if(!u) return '（URL未発行）';
  try{ var x=new URL(u); return x.host+(x.pathname==='/'?'':x.pathname); }catch(e){ return u; } }
/* 行に出す「どこにあるか」。公開ならホスト、手元ならパス */
function whereOf(it){ return isLocal(it) ? (it.source||'（場所不明）') : host(it.url); }

function filtered(){
  var q=st.q.trim().toLowerCase();
  /* 没は既定で隠す。ただし「没」で絞り込んだとき、または「没も表示」を押したときは出す */
  var showD = st.showDropped || st.status==='没' || st.tags.indexOf('没')>=0;
  var r=live().filter(function(it){
    if(!showD && isDropped(it)) return false;
    if(st.place && placeOf(it)!==st.place) return false;
    if(st.cat && it.cat!==st.cat) return false;
    if(st.status==='没'){ if(!isDropped(it)) return false; }
    else if(st.status && it.status!==st.status) return false;
    if(st.owner && (it.owner||'（未記入）')!==st.owner) return false;
    if(st.tags.length){for(var i=0;i<st.tags.length;i++){if((it.tags||[]).indexOf(st.tags[i])<0)return false;}}
    if(q){
      var hay=[it.name,it.url,it.summary,(it.contents||[]).join(' '),(it.tags||[]).join(' '),
               it.note,it.access,it.source,it.owner].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  var ord=STATUS.map(function(s){return s.k;});
  r.sort(function(a,b){
    if(st.sort==='name') return a.name.localeCompare(b.name,'ja');
    if(st.sort==='status'){var d=ord.indexOf(a.status)-ord.indexOf(b.status);if(d)return d;
      return a.name.localeCompare(b.name,'ja');}
    if(st.sort==='place'){ var pa=(isLocal(a)?1:0)-(isLocal(b)?1:0); if(pa) return pa;
      return (a.source||'').localeCompare(b.source||'','ja')||a.name.localeCompare(b.name,'ja'); }
    return String(b.upd||'').localeCompare(String(a.upd||''));
  });
  return r;
}

}

var IS_FILE = location.protocol==='file:';
/* file:// で開いた台帳なら、手元のHTMLをそのまま開けるリンクにできる */
function fileHref(it){
  if(!isLocal(it)||!it.source||!IS_FILE) return '';
  /* source はデスクトップからの相対パス。台帳をどこから開いていても
     デスクトップの位置に戻れるように、URLから逆算する */
  var here=location.href.replace(/[^\/]*$/,'');
  var m=here.match(/^(.*\/)00_%E7%8F%BE%E5%BD%B9%E3%83%84%E3%83%BC%E3%83%AB\//i)

function storeShot(file){
  if(!file||!openId) return;
  var fr=new FileReader();
  fr.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=Math.min(440,img.width), h=Math.round(img.height*w/img.width);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=Math.min(h,620);
      cv.getContext('2d').drawImage(img,0,0,w,h);
      db.shots[openId]={d:cv.toDataURL('image/jpeg',0.62),_ts:now()};
      saveShotLocal(openId); render(); openDrawer(openId); pushShot(openId); toast('画面を保存しました');
    };
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
}

function importFile(f){
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);

      /* 稼働ログ（scan_effort.py が作る 稼働ログ.json）はここで受ける */
      if(d && d.kind==='effort' && d.months){ importEffort(d); return; }

      var arr=Array.isArray(d)?d:(d.items||[]);
      var add=0,upd=0,skip=0,t=now();
      arr.forEach(function(it){
        if(!it) return;
        if(!it.name && !it._kind) return;   /* 設定・稼働ログの行は name を持たない */
        it.id=it.id||('u'+t.toString(36)+Math.random().toString(36).slice(2,5));
        var ex=byId(it.id);
        /* 自動検出（_auto）は、既にある行を絶対に上書きしない。
           手で書いた説明や状態が、週次スキャンで巻き戻るのを防ぐため。 */
        if(ex && it._auto){ skip++; return; }
        it._ts=it._ts||t;
        if(ex){ Object.assign(ex,it); ex._ts=t; upd++; }
        else{ db.items.push(it); add++; }
      });
      if(d.shots) Object.keys(d.shots).forEach(function(k){
        db.shots[k]={d:d.shots[k],_ts:t}; saveShotLocal(k); pushShot(k); });
      saveLocal(); render(); schedulePush();
      toast('読み込みました（新規 '+add+' ／ 更新 '+upd+(skip?' ／ 既知 '+skip+'件は据え置き':'')+'）');
      if(add && arr.some(function(i){return i._auto;})){ st.status='未整理'; st.cat=''; st.q=''; $('q').value=''; render(); }
    }catch(err){ console.warn(err); toast('JSONを読めませんでした'); }
  };
  fr.readAsText(f);
}

/* ==================================================================
   投資対効果（コストカットの見える化）
   ------------------------------------------------------------------
   ・設定・稼働ログ・月次スナップショットは、items 配列の中に
     「id が __ で始まり _kind を持つ行」として置く。
     こうすると既存の暗号化・項目単位マージ・同期にそのまま乗るので、
     Firestore のパスもセキュリティルールも触らずに済む。
   ・台帳の一覧や件数には出さない（live() が _kind を除いている）。
   ・金額は「削減時間×時給」の一本値にしない。実際に払わなくなった
     残業代（②）と、空いた時間の機会価値（③）を必ず分けて出す。
   ================================================================== */

var ROLE=[{k:'exec',l:'役員'},{k:'mgr',l:'管理職'},{k:'staff',l:'一般'},{k:'part',l:'パート'}];
var CONF=[{k:'A',l:'実測',x:1},{k:'B',l:'聞き取り',x:.8},{k:'C',l:'推定',x:.5}];
var QAX=[{k:'dep',l:'属人化の解消'},{k:'err',l:'ミス・手戻りの削減'},{k:'spd',l:'判断の速さ'},
         {k:'cust',l:'取引先への価値'},{k:'ex',l:'従業員体験'}];
var SAAS_DEF=[
  {k:'workflow',label:'申請・ワークフロー'},
  {k:'bi',      label:'BIダッシュボード'},
  {k:'portal',  label:'社内ポータル・ナレッジ'},
  {k:'app',     label:'業務アプリ'},
  {k:'form',    label:'フォーム・アンケート'},
  {k:'pm',      label:'案件・プロジェクト管理'},
  {k:'custom',  label:'受託開発（スクラッチ）'}
];
/* 稼働ログの突き合わせで、これらは名前が汎用すぎて当たらないので単独では使わない */
var GENERIC=['index.html','index.htm','main.html','app.html','style.css','script.js','data.json'];

/* 設定・稼働ログ・スナップショットの行を取り出す。
   これらには _kind と一緒に _del も立ててある。理由は、別の端末に残っている
   旧版（_kind を知らない版）で開かれたとき、_del だけは昔から見ているので
   一覧に出ずに済むから。中身は消えないし、同期でも保持される。 */
function sysGet(id){ var x=byId(id); return (x && x._kind) ? x : null; }
function sysNew(id,kind){ return {id:id,_kind:kind,_del:true}; }
function nv(v){ return (v===0||v)?v:''; }
function hh(v){ return (Math.round((+v||0)*10)/10).toLocaleString('ja-JP'); }
function man(v){ return (Math.round((+v||0)/1000)/10).toLocaleString('ja-JP'); }  /* 万円・小数1桁 */

/* ── 設定 ── */
function cfgGet(){
  var c=sysGet('__cfg')||{};
  var o={wage:{exec:0,mgr:0,staff:0,part:0},wageMe:0,otRate:0,otShare:0,
         lic:{seats:0,monthly:0},saas:{}};
  if(c.wage) for(var a in c.wage){ if(c.wage[a]!=null) o.wage[a]=c.wage[a]; }
  if(c.lic)  for(var b in c.lic){ if(c.lic[b]!=null) o.lic[b]=c.lic[b]; }
  ['wageMe','otRate','otShare'].forEach(function(k){ if(c[k]!=null) o[k]=c[k]; });
  SAAS_DEF.forEach(function(s){
    var src=(c.saas||{})[s.k]||{};
    o.saas[s.k]={per:+src.per||0,init:+src.init||0,src:src.src||'',srcdate:src.srcdate||''};
  });
  return o;
}
function cfgSave(mut){
  var c=sysGet('__cfg');
  if(!c){ c=sysNew('__cfg','cfg'); c.wage={}; c.lic={}; c.saas={}; db.items.push(c); }
  if(!c.wage) c.wage={};
  if(!c.lic)  c.lic={};
  if(!c.saas) c.saas={};
  mut(c); c._ts=now(); saveLocal(); schedulePush();
}
function wageOf(c,role){ return +(c.wage[role||'staff']||0); }
function confX(k){ for(var i=0;i<CONF.length;i++){ if(CONF[i].k===k) return CONF[i].x; } return .5; }
function confL(k){ for(var i=0;i<CONF.length;i++){ if(CONF[i].k===k) return CONF[i].l; } return '推定'; }
function saasLabel(k){ for(var i=0;i<SAAS_DEF.length;i++){ if(SAAS_DEF[i].k===k) return SAAS_DEF[i].label; } return ''; }

/* ── 稼働ログ ── */
function effortRec(){ return sysGet('__effort'); }
var _efC={}, _efStamp='';
function effortFor(it){
  var E=effortRec();
  if(!E||!E.files||!E.files.length) return {h:0,n:0};
  if(_efStamp!==String(E._ts)){ _efC={}; _efStamp=String(E._ts); }
  if(_efC[it.id]) return _efC[it.id];
  var src=String(it.source||'').replace(/\\/g,'/').toLowerCase().replace(/\/+$/,'');
  var seg=src.split('/').filter(Boolean), needles=[];
  if(seg.length>=2) needles.push(seg.slice(-2).join('/'));
  var last=seg.length?seg[seg.length-1]:'';
  if(last && GENERIC.indexOf(last)<0) needles.push(last);
  var nm=String(it.name||'').toLowerCase();
  var h=0,n=0;
  E.files.forEach(function(f){
    var p=String(f.path||'').replace(/\\/g,'/').toLowerCase(), hit=false, i;
    for(i=0;i<needles.length;i++){ if(needles[i].length>=5 && p.indexOf(needles[i])>=0){ hit=true; break; } }
    if(!hit && nm.length>=5 && p.indexOf(nm)>=0) hit=true;
    if(hit){ h+=(+f.h||0); n++; }
  });
  var r={h:Math.round(h*10)/10,n:n};
  _efC[it.id]=r;
  return r;
}
function importEffort(d){
  var E=sysGet('__effort');
  if(!E){ E=sysNew('__effort','effort'); db.items.push(E); }
  E.months=d.months||{}; E.total=d.total||{}; E.generated=d.generated||''; E.idleMin=d.idleMin||0;
  /* 0.05h 未満は誤差なので落とす。台帳の暗号文を膨らませないため */
  E.files=(d.files||[]).filter(function(f){ return (+f.h||0)>=0.05; })
    .map(function(f){ return {path:f.path,base:f.base,h:+f.h||0,sessions:+f.sessions||0}; });
  E._ts=now(); _efStamp='';
  saveLocal(); schedulePush(); render();
  toast('稼働ログを取り込みました（'+hh((d.total||{}).h)+'h ／ 成果物 '+E.files.length+'件）');
  setTab('invest');
}

/* ── 計算 ── */
/* 対象は「仕事」かつ「運用中」。プライベートと没は経営報告に混ぜない */
function roiTargets(){
  return live().filter(function(i){ return i.cat==='仕事' && i.status==='運用中' && !isDropped(i); });
}
function calcItem(it,c){
  var r=it.roi||{};
  var n=+r.n||0, f=+r.f||0, sv=Math.max(0,(+r.before||0)-(+r.after||0));
  var H=n*f*12*sv/60;                                   /* 年間削減時間 */
  var x=confX(r.conf);                                  /* 確度係数 */
  var ot=Math.min(100,Math.max(0,+c.otShare||0))/100;   /* 残業だった割合 */
  var auto=effortFor(it);
  var bh=(r.buildAuto===false)?(+r.buildH||0):auto.h;
  var kh=+r.keepH||0;
  var s=r.saasK?c.saas[r.saasK]:null;
  var sOk=!!(s&&((+s.per||0)>0||(+s.init||0)>0));
  var q=r.q||{}, qs=0, qn=0;
  QAX.forEach(function(a){ if((+q[a.k]||0)>0){ qs+=+q[a.k]; qn++; } });
  return {it:it, H:H, x:x,
    cash: H*ot*(+c.otRate||0)*x,
    value:H*(1-ot)*wageOf(c,r.role)*x,
    bh:bh, kh:kh, auto:auto,
    labor:(bh+kh)*(+c.wageMe||0),
    saas: sOk ? ((+r.saasSeats||0)*(+s.per||0)*12+(+s.init||0)) : 0,
    saasOk:sOk, saasWarn:!!(sOk && !s.srcdate),
    filled:(n>0 && f>0 && sv>0),
    q:q, qavg:qn?qs/qn:0};
}
function calcAll(){
  var c=cfgGet(), rows=roiTargets().map(function(it){ return calcItem(it,c); });
  var sumBh=0; rows.forEach(function(r){ sumBh+=r.bh; });
  var licYear=(+c.lic.seats||0)*(+c.lic.monthly||0)*12;
  var T={n:rows.length,filled:0,H:0,cash:0,value:0,invest:0,labor:0,lic:0,saas:0,
         bh:0,kh:0,licYear:licYear,saasWarn:false,conf:{A:0,B:0,C:0},q:{}};
  QAX.forEach(function(a){ T.q[a.k]={s:0,n:0}; });
  rows.forEach(function(r){
    r.lic = sumBh>0 ? licYear*r.bh/sumBh : 0;      /* ライセンス費は開発時間で按分 */
    r.invest = r.labor + r.lic;
    r.gain = r.cash + r.value;
    r.net = r.gain - r.invest;
    r.pay = r.gain>0 ? r.invest/(r.gain/12) : null;
    r.avoid = r.saasOk ? r.saas - r.invest : null;
    T.H+=r.H; T.cash+=r.cash; T.value+=r.value; T.invest+=r.invest;
    T.labor+=r.labor; T.lic+=r.lic; T.saas+=r.saas; T.bh+=r.bh; T.kh+=r.kh;
    if(r.filled){
      T.filled++;
      T.conf[(r.it.roi||{}).conf||'C']=(T.conf[(r.it.roi||{}).conf||'C']||0)+1;
      QAX.forEach(function(a){ var v=+(r.q[a.k])||0; if(v>0){ T.q[a.k].s+=v; T.q[a.k].n++; } });
    }
  });
  T.gain=T.cash+T.value;
  T.net=T.gain-T.invest;
  T.roi=T.invest>0?T.gain/T.invest:null;
  T.pay=T.gain>0?T.invest/(T.gain/12):null;
  T.avoid=T.saas>0?T.saas-T.invest:null;
  return {c:c,rows:rows,T:T};
}

/* ── 経営報告タブ ── */
function kpiBox(lab,val,unit,cls,sub){
  return '<div class="kpi '+(cls||'')+'"><div class="lab">'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<span class="u">'+unit+'</span>':'')+'</div>'+
    '<div class="sub">'+(sub||'&nbsp;')+'</div></div>';
}
function barRow(lab,disp,ratio,cls,note){
  var w=Math.max(0,Math.min(100,(ratio||0)*100));
  return '<div class="brow"><div class="bl">'+lab+'</div>'+
    '<div class="bt"><div class="bf '+(cls||'')+'" style="width:'+w.toFixed(1)+'%"></div></div>'+
    '<div class="bv">'+disp+(note?'<small> '+note+'</small>':'')+'</div></div>';
}
function dltTxt(p,k,cur,unit){
  if(!p||!p.kpi||p.kpi[k]==null) return '';
  var d=cur-(+p.kpi[k]||0);
  if(Math.abs(d)<(unit==='h'?0.05:500)) return '<span class="dlt">'+p.ym+'比 ±0</span>';
  var v=(unit==='h')?hh(Math.abs(d))+'h':man(Math.abs(d))+'万円';
  return '<span class="dlt '+(d>0?'up':'dn')+'">'+p.ym+'比 '+(d>0?'＋':'−')+v+'</span>';
}
function radarSVG(vals){
  var n=vals.length, cx=100, cy=100, R=74, i, a, pts=[], grid='';
  [1,.75,.5,.25].forEach(function(s){
    var p=[];
    for(i=0;i<n;i++){ a=-Math.PI/2+i*2*Math.PI/n;
      p.push((cx+R*s*Math.cos(a)).toFixed(1)+','+(cy+R*s*Math.sin(a)).toFixed(1)); }
    grid+='<polygon points="'+p.join(' ')+'" fill="none" stroke="#ddd6c7" stroke-width="1"/>';
  });
  for(i=0;i<n;i++){ a=-Math.PI/2+i*2*Math.PI/n;
    grid+='<line x1="100" y1="100" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+
          (cy+R*Math.sin(a)).toFixed(1)+'" stroke="#ddd6c7" stroke-width="1"/>'; }
  var dots='';
  for(i=0;i<n;i++){
    a=-Math.PI/2+i*2*Math.PI/n;
    var r=R*Math.max(0,Math.min(1,(vals[i]||0)/5));
    var x=(cx+r*Math.cos(a)).toFixed(1), y=(cy+r*Math.sin(a)).toFixed(1);
    pts.push(x+','+y);
    dots+='<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="#2f4858"/>';
  }
  return '<svg viewBox="0 0 200 200" width="196" height="196" aria-hidden="true">'+grid+
    '<polygon points="'+pts.join(' ')+'" fill="rgba(47,72,88,.20)" stroke="#2f4858" stroke-width="2"/>'+
    dots+'</svg>';
}
