<div class="gate" id="gate">

  <div class="sync" id="sync"><span class="sdot" id="sdot"></span><span id="stxt">…</span></div>
  <div class="count" id="count"></div>
  <button class="tbtn pri" id="btnAdd">＋ URLを追加</button>
  <button class="tbtn" id="btnExp">書き出し</button>
  <button class="tbtn" id="btnImp">読み込み</button>
  <input type="file" id="fileImp" accept="application/json" hidden>
</header>

<div class="layout">
  <aside>
    <h3>区分</h3><div id="fCat"></div>
    <h3>状態</h3><div id="fStatus"></div>
    <h3>作った人</h3><div id="fOwner"></div>

  <main><div id="list"></div></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><h2 id="dTitle"></h2><button class="dclose" id="dClose">&times;</button></div>
  <div class="dbody" id="dBody"></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="mTitle">URLを追加</h3>
  <div class="f"><label>名前</label><input id="mName" placeholder="例）発注依頼システム"></div>
  <div class="f"><label>URL</label><input id="mUrl" placeholder="https://... ／ 未発行なら空欄でOK"></div>
  <div class="f2">
    <div class="f"><label>区分</label><select id="mCat"><option>仕事</option><option>プライベート</option></select></div>
    <div class="f"><label>状態</label><select id="mStatus"></select></div>
  </div>
  <div class="f"><label>タグ（カンマ区切り）</label><input id="mTags" placeholder="基幹, ダッシュボード, 6社共有"></div>
  <div class="f"><label>ひとことで言うと</label><textarea id="mSummary" placeholder="開かなくても何のページか分かる1〜2行"></textarea></div>
  <div class="f"><label>中に何があるか（1行1項目）</label><textarea id="mContents" style="min-height:96px" placeholder="申請フォーム（物販／工事の2書式）&#10;仕入先・商品マスタのサジェスト&#10;送信すると営業サポートへ自動メール"></textarea></div>
  <div class="f2">
    <div class="f"><label>公開範囲・ログイン</label><input id="mAccess" placeholder="社内限定（Entra）／リンクを知っていれば誰でも"></div>
    <div class="f"><label>最終更新（YYYY-MM）</label><input id="mUpd" placeholder="2026-09"></div>
  </div>
  <div class="f"><label>作った人・面倒を見る人</label><input id="mOwner" placeholder="自分 ／ 他の社員（名前） ／ 他部署">
    <div class="hint">壊れたとき誰に聞くか。自分が作っていないものほど大事</div></div>
  <div class="f"><label>実体のある場所</label><input id="mSource" placeholder="00_現役ツール\デプロイ\..."><div class="hint">編集するときに開くフォルダ／ファイル</div></div>
  <div class="f"><label>注意点・引き継ぎメモ</label><textarea id="mNote" placeholder="URL変更禁止、デプロイは全置換、など"></textarea></div>
  <div class="mact">
    <button class="tbtn del" id="mDel">この行を削除</button>
    <button class="tbtn" id="mCancel">やめる</button>
    <button class="tbtn pri" id="mSave">保存</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

var APP='url-ledger';
var STATE_PATH=['artifacts',APP,'public','data','state','main'];
var SHOTS_PATH=['artifacts',APP,'public','data','shots'];
var SALT='url-ledger/2026-09/sumihei';
var LS='url_ledger_v2';
var LSKEY='url_ledger_key_v2';

var STATUS=[
  {k:'未整理',   c:'s6', b:'b6'},   /* 自動検出したばかりで、まだ説明を書いていないもの */
  {k:'運用中',   c:'s1', b:'b1'},
  {k:'期間終了', c:'s2', b:'b2'},
  {k:'旧版',     c:'s3', b:'b3'},
  {k:'停止中',   c:'s4', b:'b4'},
  {k:'URL未確認',c:'s5', b:'b5'}
];

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}
function now(){return Date.now();}

/* ── 暗号（AES-GCM / PBKDF2） ── */
var CK=null;
var b64=function(buf){var b='',a=new Uint8Array(buf);
  for(var i=0;i<a.length;i++) b+=String.fromCharCode(a[i]); return btoa(b);};
var unb64=function(s){var b=atob(s),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a;};

async function deriveKey(pass){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:enc.encode(SALT),iterations:150000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function encrypt(text){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CK,new TextEncoder().encode(text));
  var out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
  return b64(out);
}
async function decrypt(blob){
  var raw=unb64(blob);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},CK,raw.slice(12));
  return new TextDecoder().decode(pt);
}
async function saveKey(){ var raw=await crypto.subtle.exportKey('raw',CK);
  try{ localStorage.setItem(LSKEY,b64(raw)); }catch(e){} }
async function loadKey(){
  var s=null; try{ s=localStorage.getItem(LSKEY); }catch(e){}
  if(!s) return false;
  CK=await crypto.subtle.importKey('raw',unb64(s),{name:'AES-GCM'},true,['encrypt','decrypt']);
  return true;
}

/* ── 手元の状態 ── */
var db={items:[],shots:{}};   /* items: [{...,_ts,_del?}]  shots:{id:{d:dataURL,_ts}} */
function loadLocal(){
  try{ var r=localStorage.getItem(LS); if(r){ var p=JSON.parse(r);
    db.items=p.items||[]; db.shots=p.shots||{}; } }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS,JSON.stringify(db)); }
  catch(e){ toast('端末への保存が容量オーバーです（画像を減らしてください）'); }
}
function live(){ return db.items.filter(function(i){return !i._del;}); }
function byId(id){ for(var i=0;i<db.items.length;i++){ if(db.items[i].id===id) return db.items[i]; } return null; }

/* 項目単位のマージ：新しい_tsが勝つ */
function mergeItems(remote){
  var map={},changed=false;
  db.items.forEach(function(i){map[i.id]=i;});
  (remote||[]).forEach(function(r){
    var l=map[r.id];
    if(!l){ map[r.id]=r; changed=true; }
    else if((r._ts||0)>(l._ts||0)){ map[r.id]=r; changed=true; }
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  var localNewer=arr.some(function(a){
    var r=(remote||[]).filter(function(x){return x.id===a.id;})[0];
    return !r || (a._ts||0)>(r._ts||0);
  });
  db.items=arr;
  return {changed:changed, push:localNewer};
}

/* ── クラウド ── */
var cloud={ready:false,fs:null,db:null,state:null,shots:null};
function setSync(cls,txt){ $('sdot').className='sdot '+cls; $('stxt').textContent=txt; }

async function initCloud(){
  if(cloud.ready) return true;
  if(location.protocol==='file:'){ setSync('off','この端末のみ'); return false; }
  try{
    setSync('busy','接続中');
    var m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var au=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    var fs=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    var app=m.initializeApp(FB);
    await au.signInAnonymously(au.getAuth(app));
    cloud.fs=fs; cloud.db=fs.getFirestore(app);
    cloud.state=fs.doc.apply(null,[cloud.db].concat(STATE_PATH));
    cloud.shots=fs.collection.apply(null,[cloud.db].concat(SHOTS_PATH));
    cloud.ready=true;
    return true;
  }catch(e){ console.warn(e); setSync('err','未接続'); return false; }
}

async function pullCloud(){
  if(!cloud.ready) return {exists:false};
  var snap=await cloud.fs.getDoc(cloud.state);
  if(!snap.exists()) return {exists:false};
  var d=snap.data();
  var json=await decrypt(d.blob);          /* 合言葉が違えばここで例外 */
  return {exists:true, items:JSON.parse(json).items||[]};
}
var pushT=null;
function schedulePush(){ if(!cloud.ready) return; clearTimeout(pushT); pushT=setTimeout(pushCloud,900); }
async function pushCloud(){
  if(!cloud.ready) return;
  try{
    setSync('busy','保存中');
    var blob=await encrypt(JSON.stringify({items:db.items}));
    await cloud.fs.setDoc(cloud.state,{blob:blob,updatedAt:now(),n:db.items.length});
    setSync('ok','同期済み');
  }catch(e){ console.warn(e); setSync('err','保存できず'); }
}
async function pullShots(){
  if(!cloud.ready) return;
  try{
    var qs=await cloud.fs.getDocs(cloud.shots);
    var n=0;
    for(var i=0;i<qs.docs.length;i++){
      var doc=qs.docs[i], d=doc.data();
      var l=db.shots[doc.id];
      if(l && (l._ts||0)>=(d.updatedAt||0)) continue;
      try{ db.shots[doc.id]={d:await decrypt(d.blob),_ts:d.updatedAt||0}; n++; }catch(e){}
    }
    if(n){ saveLocal(); render(); }
  }catch(e){ console.warn(e); }
}
async function pushShot(id){
  if(!cloud.ready) return;
  var s=db.shots[id];
  try{
    if(!s){ await cloud.fs.deleteDoc(cloud.fs.doc.apply(null,[cloud.db].concat(SHOTS_PATH,[id]))); return; }
    var blob=await encrypt(s.d);
    await cloud.fs.setDoc(cloud.fs.doc.apply(null,[cloud.db].concat(SHOTS_PATH,[id])),
      {blob:blob,updatedAt:s._ts});
  }catch(e){ console.warn(e); toast('画像をクラウドに送れませんでした'); }
}

/* ── 起動 ── */
var booted=false, cloudHasData=false;
async function boot(){
  loadLocal();
  if(await loadKey()){ $('gate').classList.add('hide'); start(); return; }
  /* 鍵がない：クラウドに台帳があるかだけ先に見て、案内文を切り替える */
  if(await initCloud()){
    try{ cloudHasData=(await cloud.fs.getDoc(cloud.state)).exists(); }catch(e){}
  }
  showGate(cloudHasData?'ask':'new');
}
function showGate(mode){
  $('gate').classList.remove('hide');
  if(mode==='new'){
    $('gMsg').textContent='まだ台帳がありません。合言葉を決めてください。以後、どの端末でもこの言葉で開きます。';
    $('gGo').textContent='この合言葉で始める';
    $('gSub').innerHTML='合言葉は暗号化の鍵そのものです。<b>忘れると誰にも復元できません。</b><br>'+
      '暗号文は誰でも取得できる前提なので、8文字以上・推測されにくい語にしてください。<br>'+
      '解錠したら「読み込み」から <b>URL台帳_seed.json</b> を取り込んでください。';
  }else{
    $('gMsg').textContent='合言葉を入れてください';
    $('gGo').textContent='解錠する';

  }

}
$('gGo').onclick=unlock;
$('gPass').addEventListener('keydown',function(e){ if(e.key==='Enter') unlock(); });

async function unlock(){
  var p=$('gPass').value;
  if(p.length<8){ $('gErr').textContent='8文字以上にしてください（短いと総当たりされます）'; return; }
  $('gErr').textContent='';
  CK=await deriveKey(p);
  var ok=await initCloud();
  if(ok){
    try{
      var r=await pullCloud();
      if(r.exists){
        mergeItems(r.items);
        saveLocal();
      }
    }catch(e){
      CK=null;
      $('gErr').textContent='合言葉が違います';
      return;
    }
  }
  await saveKey();
  $('gPass').value='';
  $('gate').classList.add('hide');
  start();
}

async function start(){
  if(booted){ render(); return; }
  booted=true;
  render();
  if(!cloud.ready) await initCloud();
  if(cloud.ready){
    try{
      var r=await pullCloud();
      if(r.exists){
        var m=mergeItems(r.items);
        saveLocal(); render();
        setSync('ok','同期済み');
        if(m.push) schedulePush();
      }else{
        setSync('ok', db.items.length?'未送信':'クラウドは空');
        if(db.items.length) schedulePush();
      }
      pullShots();
    }catch(e){
      setSync('err','鍵が合いません');
      toast('クラウドの中身を復号できませんでした。合言葉を確認してください');
    }
  }
}

/* ── 絞り込み ── */
var st={q:'',cat:'',status:'',owner:'',tags:[],sort:'upd'};
function statusOf(k){for(var i=0;i<STATUS.length;i++){if(STATUS[i].k===k)return STATUS[i];}return STATUS[4];}
function host(u){ if(!u) return '（URL未発行）';
  try{ var x=new URL(u); return x.host+(x.pathname==='/'?'':x.pathname); }catch(e){ return u; } }

function filtered(){
  var q=st.q.trim().toLowerCase();
  var r=live().filter(function(it){
    if(st.cat && it.cat!==st.cat) return false;
    if(st.status && it.status!==st.status) return false;
    if(st.owner && (it.owner||'（未記入）')!==st.owner) return false;
    if(st.tags.length){for(var i=0;i<st.tags.length;i++){if((it.tags||[]).indexOf(st.tags[i])<0)return false;}}
    if(q){
      var hay=[it.name,it.url,it.summary,(it.contents||[]).join(' '),(it.tags||[]).join(' '),
               it.note,it.access,it.source,it.owner].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  var ord=STATUS.map(function(s){return s.k;});
  r.sort(function(a,b){
    if(st.sort==='name') return a.name.localeCompare(b.name,'ja');
    if(st.sort==='status'){var d=ord.indexOf(a.status)-ord.indexOf(b.status);if(d)return d;
      return a.name.localeCompare(b.name,'ja');}
    return String(b.upd||'').localeCompare(String(a.upd||''));
  });
  return r;
}

function render(){
  var all=live(), list=filtered();

  $('count').innerHTML='運用中 <b>'+on+'</b> ／ 全 <b>'+all.length+'</b> 件'+

  $('fCat').innerHTML='<button class="fl'+(st.cat===''?' on':'')+'" data-cat="">すべて<span>'+all.length+'</span></button>'+
    cats.map(function(c){var n=all.filter(function(i){return i.cat===c;}).length;
      return '<button class="fl'+(st.cat===c?' on':'')+'" data-cat="'+c+'">'+c+'<span>'+n+'</span></button>';}).join('');

  $('fStatus').innerHTML='<button class="fl'+(st.status===''?' on':'')+'" data-st="">すべて<span>'+all.length+'</span></button>'+
    STATUS.map(function(s){var n=all.filter(function(i){return i.status===s.k;}).length;
      if(!n) return '';
      return '<button class="fl'+(st.status===s.k?' on':'')+'" data-st="'+s.k+'">'+s.k+'<span>'+n+'</span></button>';}).join('');

  var oc={}; all.forEach(function(i){var o=i.owner||'（未記入）'; oc[o]=(oc[o]||0)+1;});
  var owners=Object.keys(oc).sort(function(a,b){ if(a==='自分')return -1; if(b==='自分')return 1;
    return oc[b]-oc[a]||a.localeCompare(b,'ja'); });
  $('fOwner').innerHTML='<button class="fl'+(st.owner===''?' on':'')+'" data-own="">すべて<span>'+all.length+'</span></button>'+
    owners.map(function(o){return '<button class="fl'+(st.owner===o?' on':'')+'" data-own="'+esc(o)+'">'+
      esc(o)+'<span>'+oc[o]+'</span></button>';}).join('');

  var tc={}; all.forEach(function(i){(i.tags||[]).forEach(function(t){tc[t]=(tc[t]||0)+1;});});
  var tags=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]||a.localeCompare(b,'ja');});
  $('fTags').innerHTML=tags.map(function(t){
    return '<button class="chip'+(st.tags.indexOf(t)>=0?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+' '+tc[t]+'</button>';}).join('');

  if(!list.length){
    $('list').innerHTML='<div class="empty">'+(all.length?'該当なし':
      'まだ1件もありません。<br>「読み込み」から <b>URL台帳_seed.json</b> を取り込むか、「＋URLを追加」で登録してください。')+'</div>';
    return;
  }
  var groups={},order=[];
  list.forEach(function(it){var g=st.sort==='status'?it.status:it.cat;
    if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(it);});
  $('list').innerHTML=order.map(function(g){
    return '<div class="grp"><div class="grp-h">'+esc(g)+'　'+groups[g].length+'</div>'+
      groups[g].map(rowHTML).join('')+'</div>';}).join('');
}

/* ── スクショ ── */
function storeShot(file){
  if(!file||!openId) return;
  var fr=new FileReader();
  fr.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=Math.min(440,img.width), h=Math.round(img.height*w/img.width);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=Math.min(h,620);
      cv.getContext('2d').drawImage(img,0,0,w,h);
      db.shots[openId]={d:cv.toDataURL('image/jpeg',0.62),_ts:now()};
      saveLocal(); render(); openDrawer(openId); pushShot(openId); toast('画面を保存しました');
    };
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
}

  var it=byId(editId);
  if(it){ it._del=true; it._ts=now(); }
  if(db.shots[editId]){ delete db.shots[editId]; pushShot(editId); }
  saveLocal(); closeModal(); closeDrawer(); render(); schedulePush(); toast('削除しました');
};
$('mCancel').onclick=closeModal;
$('modal').addEventListener('click',function(e){ if(e.target===$('modal')) closeModal(); });

/* ── 書き出し・読み込み ── */
$('btnExp').onclick=function(){
  var payload={app:APP,exported:new Date().toISOString(),items:live(),
    shots:Object.keys(db.shots).reduce(function(a,k){a[k]=db.shots[k].d;return a;},{})};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='URL台帳_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('JSONを書き出しました');
};
$('btnImp').onclick=function(){ $('fileImp').click(); };
$('fileImp').onchange=function(e){ importFile(e.target.files[0]); e.target.value=''; };

function importFile(f){
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      var arr=Array.isArray(d)?d:(d.items||[]);
      var add=0,upd=0,skip=0,t=now();
      arr.forEach(function(it){
        if(!it||!it.name) return;
        it.id=it.id||('u'+t.toString(36)+Math.random().toString(36).slice(2,5));
        var ex=byId(it.id);
        /* 自動検出（_auto）は、既にある行を絶対に上書きしない。
           手で書いた説明や状態が、週次スキャンで巻き戻るのを防ぐため。 */
        if(ex && it._auto){ skip++; return; }
        it._ts=it._ts||t;
        if(ex){ Object.assign(ex,it); ex._ts=t; upd++; }
        else{ db.items.push(it); add++; }
      });
      if(d.shots) Object.keys(d.shots).forEach(function(k){
        db.shots[k]={d:d.shots[k],_ts:t}; pushShot(k); });
      saveLocal(); render(); schedulePush();
      toast('読み込みました（新規 '+add+' ／ 更新 '+upd+(skip?' ／ 既知 '+skip+'件は据え置き':'')+'）');
      if(add && arr.some(function(i){return i._auto;})){ st.status='未整理'; st.cat=''; st.q=''; $('q').value=''; render(); }
    }catch(err){ console.warn(err); toast('JSONを読めませんでした'); }
  };
  fr.readAsText(f);
}

/* JSONをウィンドウにドラッグ＆ドロップでも取り込める */
var dz=document.createElement('div');
dz.className='drop'; dz.id='drop';
dz.innerHTML='ここにJSONを落とすと台帳に取り込みます';
document.body.appendChild(dz);
var dragN=0;
window.addEventListener('dragenter',function(e){ e.preventDefault(); if(++dragN===1) dz.classList.add('on'); });
window.addEventListener('dragover',function(e){ e.preventDefault(); });
window.addEventListener('dragleave',function(e){ if(--dragN<=0){ dragN=0; dz.classList.remove('on'); } });
window.addEventListener('drop',function(e){
  e.preventDefault(); dragN=0; dz.classList.remove('on');
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) importFile(f);
});

/* ── イベント ── */
var aside=document.querySelector('aside');
function openFilter(){ aside.classList.add('open'); $('scrim').classList.add('on'); }
function closeFilter(){ aside.classList.remove('open');
  if(!$('drawer').classList.contains('on')) $('scrim').classList.remove('on'); }

$('q').addEventListener('input',function(e){ st.q=e.target.value; render(); });
$('sort').addEventListener('change',function(e){ st.sort=e.target.value; render(); });
$('btnAdd').onclick=function(){ openModal(null); };
$('btnReset').onclick=function(){ st={q:'',cat:'',status:'',owner:'',tags:[],sort:st.sort}; $('q').value=''; render(); closeFilter(); };
$('btnLock').onclick=function(){
  if(!confirm('この端末の鍵を消します。次回は合言葉の入力が必要になります。')) return;
  try{ localStorage.removeItem(LSKEY); localStorage.removeItem(LS); }catch(e){}
  location.reload();
};
$('btnFilter').onclick=function(){ aside.classList.contains('open')?closeFilter():openFilter(); };
$('dClose').onclick=closeDrawer;
$('scrim').onclick=function(){ closeFilter(); closeDrawer(); };

document.addEventListener('click',function(e){
  var cp=e.target.closest('[data-copy]');
  if(cp){ e.stopPropagation();
    navigator.clipboard.writeText(cp.getAttribute('data-copy')).then(
      function(){toast('URLをコピーしました');},function(){toast('コピーできませんでした');});
    return; }
  if(e.target.closest('[data-stop]')){ e.stopPropagation(); return; }

  var narrow=window.innerWidth<=820;
  var c=e.target.closest('[data-cat]'); if(c){ st.cat=c.getAttribute('data-cat'); render(); if(narrow)closeFilter(); return; }
  var s=e.target.closest('[data-st]'); if(s){ st.status=s.getAttribute('data-st'); render(); if(narrow)closeFilter(); return; }
  var ow=e.target.closest('[data-own]'); if(ow){ st.owner=ow.getAttribute('data-own'); render(); if(narrow)closeFilter(); return; }
  var t=e.target.closest('[data-tag]');
  if(t){ var v=t.getAttribute('data-tag'); var i=st.tags.indexOf(v);
    if(i>=0) st.tags.splice(i,1); else st.tags.push(v); render(); return; }

  if(e.target.id==='dEdit'){ openModal(openId); return; }
  if(e.target.id==='shotDel'){ var k=openId; delete db.shots[k];
    saveLocal(); render(); openDrawer(k); pushShot(k); return; }
  if(e.target.closest('#shotBox')){ $('shotFile').click(); return; }

  var row=e.target.closest('.row'); if(row){ openDrawer(row.getAttribute('data-id')); }
});
document.addEventListener('change',function(e){
  if(e.target.id==='shotFile') storeShot(e.target.files[0]);
});
document.addEventListener('paste',function(e){
  if(!openId) return;
  var its=(e.clipboardData||{}).items||[];
  for(var i=0;i<its.length;i++){ if(its[i].type.indexOf('image')===0){ storeShot(its[i].getAsFile()); break; } }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if($('modal').classList.contains('on')) closeModal(); else { closeFilter(); closeDrawer(); } }
  if(e.key==='/'&&document.activeElement!==$('q')&&!$('modal').classList.contains('on')
     &&$('gate').classList.contains('hide')){ e.preventDefault(); $('q').focus(); }
});
window.addEventListener('online',function(){ if(cloud.ready) pushCloud(); });

boot();
</script>
