<style>
:root{
  --paper:#f4f1ea; --paper2:#fffdf8; --line:#ddd6c7; --line2:#c8bfab;
  --ink:#22201c; --ink2:#5c574d; --ink3:#8b8477;
  --red:#b23a26; --blue:#2f4858; --green:#4a7a52; --amber:#a3762a;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -14px rgba(40,35,25,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Zen Kaku Gothic New','Yu Gothic UI','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ── ヘッダー ── */
.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line2);
  padding:10px 16px 10px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:880px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand{font-family:'Zen Old Mincho',serif;font-size:1.1rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.brand::before{content:"";display:inline-block;width:5px;height:19px;background:var(--red);margin-right:8px;transform:translateY(3px)}
.asof{font-size:.7rem;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{padding:6px 11px;background:var(--paper2);border:1px solid var(--line2);border-radius:3px;
  cursor:pointer;font-size:.76rem;white-space:nowrap}
.tbtn:hover{border-color:var(--ink2);background:#fff}
.tbtn.pri{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.search{position:relative}
.search input{width:100%;padding:11px 38px 11px 36px;background:var(--paper2);border:1px solid var(--line2);
  border-radius:4px;font-size:1rem}
.search input:focus{outline:none;border-color:var(--blue);background:#fff}
.search::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-54%);color:var(--ink3);font-size:1.1rem}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;
  width:30px;height:30px;font-size:1.1rem;color:var(--ink3);cursor:pointer;display:none}
.clr.on{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line2);background:var(--paper2);border-radius:100px;
  padding:3px 11px;font-size:.76rem;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

main{max-width:880px;margin:0 auto;padding:10px 16px 90px}

/* ── 一覧 ── */
.grp-h{font-size:.72rem;letter-spacing:.12em;color:var(--ink3);font-weight:700;
  padding:14px 2px 5px;border-bottom:1px solid var(--line);margin-bottom:7px;display:flex;justify-content:space-between}
.grp-h span{font-weight:400;letter-spacing:0}
.card{display:flex;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line);
  border-radius:5px;padding:8px 8px 8px 12px;margin-bottom:6px}
.who{flex:1;min-width:0}
.nm{font-weight:700;font-size:1rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp{font-size:.72rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:none;background:none;font-size:1.15rem;width:34px;height:40px;cursor:pointer;color:var(--line2);flex-shrink:0}
.star.on{color:var(--amber)}
.acts{display:flex;gap:6px;flex-shrink:0}
.call{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;height:48px;
  border-radius:5px;border:1px solid;cursor:pointer;padding:0 8px;line-height:1.2;user-select:none}
.call small{font-size:.62rem;letter-spacing:.1em;opacity:.8}
.call b{font-size:.86rem;font-variant-numeric:tabular-nums;letter-spacing:.01em;font-weight:700}
.call.mob{background:var(--green);border-color:var(--green);color:#fff}
.call.ext{background:#fff;border-color:var(--blue);color:var(--blue)}
.call.off{background:transparent;border:1px dashed var(--line);color:var(--line2);cursor:default}
.call:not(.off):active{transform:scale(.97)}
/* 「◯◯さんの内線」への答え */
.ans{background:#fff;border:1px solid var(--blue);border-radius:8px;padding:14px 14px 12px;margin:6px 0 12px;box-shadow:var(--shadow)}
.ans-q{font-size:.8rem;color:var(--ink2);margin-bottom:8px}
.ans-q b{font-size:1.15rem;color:var(--ink);letter-spacing:.03em}
.ans .acts{gap:8px;flex-direction:column}
.ans .call{flex:none;width:100%;height:60px;flex-direction:row;gap:10px}
.ans .call small{font-size:.8rem;white-space:nowrap}
.ans .call b{font-size:1.5rem;white-space:nowrap}
.hint{font-size:.74rem;color:var(--ink3);padding:4px 2px 0}
/* 内線だけ・携帯だけの表示は1行に収めて一覧性を上げる */
.one .card{flex-wrap:nowrap;padding:6px 6px 6px 4px}
.one .who{flex-basis:auto}
.one .acts{flex-basis:auto;padding-left:0}
.one .call{flex:0 0 auto;min-width:104px}
.ans .call.ext,.ans .call.mob{flex:none}
.empty{text-align:center;color:var(--ink3);padding:40px 10px;font-size:.88rem}
.more{display:block;margin:6px auto 0;padding:8px 18px}

/* スマホ幅：名前を1段目に、番号ボタンを2段目に大きく並べる */
@media (max-width:560px){
  .card{flex-wrap:wrap;padding:6px 8px 8px 4px;gap:4px 6px}
  .who{flex-basis:calc(100% - 48px)}
  .acts{flex-basis:100%;padding-left:4px}

  .call small{font-size:.7rem}
  .call b{font-size:1rem}
  .call.ext{flex:0 0 38%}
  .call.mob:only-child{flex:1}
}

/* ── はじめての読み込み ── */
.intro{max-width:520px;margin:30px auto;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:26px 22px;text-align:center}
.intro h1{font-family:'Zen Old Mincho',serif;font-size:1.3rem;letter-spacing:.08em;margin-bottom:10px}
.intro p{font-size:.84rem;color:var(--ink2);line-height:1.9;margin-bottom:16px;text-align:left}
.drop{border:2px dashed var(--line2);border-radius:6px;padding:26px 12px;cursor:pointer;color:var(--ink2);font-size:.9rem}
.drop.hov{border-color:var(--blue);background:#fff}
.note{font-size:.72rem;color:var(--ink3);margin-top:14px;line-height:1.8;text-align:left}

/* ── 設定シート ── */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(30,26,20,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sbox{background:var(--paper);width:min(560px,100%);border-radius:10px 10px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sbox h2{font-family:'Zen Old Mincho',serif;font-size:1.05rem;margin-bottom:12px;letter-spacing:.06em}
.sbox h3{font-size:.74rem;letter-spacing:.12em;color:var(--ink3);margin:16px 0 6px}
.sbox p{font-size:.8rem;color:var(--ink2);line-height:1.8}
.sbox .tbtn{margin:6px 6px 0 0;padding:9px 14px;font-size:.82rem}
.kv{font-size:.8rem;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:500}
.warn{color:var(--red)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--paper2);padding:9px 18px;border-radius:100px;font-size:.84rem;
  transition:.2s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
</style>

<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="r1">
      <div class="brand">内線・携帯帳</div>
      <div class="asof" id="asof"></div>
      <button class="tbtn" id="btnUpd">更新</button>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="例：中澤さんの内線 ／ 内線 ／ 総務" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="クリア">×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main id="main"></main>

<div class="sheet" id="sheet">
  <div class="sbox">
    <h2>データの更新</h2>
    <p>毎月の新しい一覧表（Excel）を選ぶだけで入れ替わります。★お気に入りは名前で引き継がれます。</p>
    <button class="tbtn pri" id="btnPick2">新しいExcelを選ぶ</button>
    <h3>いま入っているデータ</h3>
    <div class="kv" id="info"></div>
    <h3>ほかのスマホ・PCに配る</h3>
    <p>番号入りのこのページを1つのファイルにして保存します。社内チャットやメールで送れば、受け取った人はExcelなしで開けます。<br><span class="warn">個人の携帯番号が入っています。公開の場所（ホームページ・GitHub等）には置かないでください。</span></p>
    <button class="tbtn" id="btnExport">番号入りファイルを保存</button>
    <h3>この端末から消す</h3>
    <button class="tbtn" id="btnClear">データを消去</button>
    <div style="text-align:right;margin-top:16px"><button class="tbtn" id="btnClose">閉じる</button></div>
  </div>
</div>

<input type="file" id="file" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
<div class="toast" id="toast"></div>

<!-- 配布用ファイルを作ったときだけ、ここに番号データが入る（公開版は空のまま） -->
<script id="embedded" type="application/json"></script>

<script>
'use strict';
const KEY='naisen.v1', FAV='naisen.fav.v1', LIMIT=120;
const SHEETJS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
// 配布用ファイルを作るため、描画前の素のHTMLを控えておく
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const isTouch=matchMedia('(pointer:coarse)').matches;

let DB=null, favs=new Set(store.get(FAV)||[]), filter='★', query='', term='', want='', showAll=false;

/* ── 文字の正規化 ── */
const half=s=>String(s??'').normalize('NFKC');
const clean=s=>half(s).replace(/\s+/g,' ').trim();
const tight=s=>clean(s).replace(/\s/g,'');
// 「役  員」「営  業」のような字間あけの見出しは詰める
const label=s=>{const t=tight(s);return t.length<=4?t:clean(s)};
const digits=s=>half(s).replace(/\D/g,'');
// 異体字や旧字は同じ字として探せるようにする
const VAR={'澤':'沢','髙':'高','﨑':'崎','濵':'浜','濱':'浜','齊':'斉','齋':'斉','斎':'斉','德':'徳','邊':'辺','邉':'辺','櫻':'桜','嶋':'島','嶌':'島','冨':'富','廣':'広','國':'国','實':'実','惠':'恵','眞':'真','藏':'蔵','龍':'竜'};
const fold=s=>tight(s).toLowerCase().replace(/./g,c=>VAR[c]||c);
const phone=s=>{const d=digits(s);return d.length>=3?d:''};
const fmtTel=d=>{
  if(/^0[789]0\d{8}$/.test(d))return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  return d;
};

/* ── 「中澤さんの内線教えて」を 名前＋欲しい番号 に読み解く ── */
// 番号データはこの端末の外へ出さないので、AIではなく決まった言い回しを取り除いて読む
const KIND=[[/内線|ないせん/g,'ext'],[/携帯|ケータイ|けいたい|スマホ|ケイタイ/g,'mob']];
function parseAsk(q){
  let s=half(q).trim(), w='';
  for(const [re,k] of KIND){if(s.search(re)>=0){w=w&&w!==k?'':(w||k);s=s.replace(re,' ')}}
  s=s.replace(/(を|が)?(教えて|おしえて|知りたい|しりたい|調べて|しらべて|探して|さがして|下さい|ください|お願い|おねがい|頂戴|ちょうだい|は何番|って何番|何番|なんばん|ある|かけたい|掛けたい)/g,' ')
     .replace(/電話番号|電話|でんわ|番号|ばんごう|連絡先/g,' ')
     .replace(/[?？!！。、,，]/g,' ');
  // 名前の後ろの敬称・助詞（「中澤さんの」「中澤部長の」）を外す
  s=s.split(/\s+/).map(t=>t.replace(/(の|は|を|って|に|へ)+$/,'').replace(/(さん|さま|様|くん|君|ちゃん|氏|殿|部長|課長|係長|主任|所長|支店長|社長|専務|常務)$/,'').replace(/(の|は)+$/,'')).filter(Boolean).join(' ');
  return {term:s.trim(),want:w};
}

/* ── Excel 読み込み ── */
function loadSheetJS(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=SHEETJS;s.onload=ok;
    s.onerror=()=>ng(new Error('読み込み部品を取得できませんでした。ネットにつながった状態でもう一度お試しください。'));document.head.appendChild(s)});
}
const rowsOf=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null,blankrows:true});

function parseWorkbook(wb){
  let asof='';
  const people=[], offices=[];

  for(const name of wb.SheetNames){
    const rows=rowsOf(wb.Sheets[name]);
    // 社員の表：「社員名」の見出しがある列ごとに 所属/課・社員№・社員名・携帯・内線 の5列ブロックが並ぶ
    let hdr=-1, starts=[];
    for(let r=0;r<Math.min(rows.length,15)&&hdr<0;r++){
      (rows[r]||[]).forEach((v,c)=>{if(tight(v)==='社員名'){starts.push(c-2)}});
      if(starts.length)hdr=r;
    }
    if(hdr>=0){
      if(!asof)for(let r=0;r<hdr;r++)for(const v of rows[r]||[])if(v&&/現在/.test(v))asof=tight(v).replace(/現在$/,'');
      for(const s of starts)parseBlock(rows,hdr+1,s,people);
      // 事務所用の番号は社員のあとにまとめる
      people.sort((a,b)=>(a.office?1:0)-(b.office?1:0));
      continue;
    }
    // 拠点の表：「名称」「電話」の見出しがある表
    for(let r=0;r<Math.min(rows.length,10);r++){
      const row=rows[r]||[];
      const ci=k=>row.findIndex(v=>tight(v)===k);
      const cN=ci('名称'), cT=ci('電話');
      if(cN<0||cT<0)continue;
      const cF=row.findIndex(v=>tight(v).toLowerCase()==='fax'), cA=ci('所在地');
      for(let i=r+1;i<rows.length;i++){
        // 名称はセル結合で見出しと1列ずれていることがある
        const x=rows[i]||[], nm=clean(x[cN])||clean(x[cN-1])||clean(x[cN+1]), tel=phone(x[cT]);
        if(nm&&tel)offices.push({name:nm,tel,telText:tight(x[cT]),fax:cF>=0?tight(x[cF]):'',addr:cA>=0?clean(x[cA]):''});
      }
      break;
    }
  }
  if(!people.length)throw new Error('「社員名」の見出しがある表が見つかりませんでした。いつもの一覧表のExcelか確認してください。');
  return {people,offices,asof};
}

function parseBlock(rows,from,s,out){
  let sec='', dept='', office=false;
  for(let r=from;r<rows.length;r++){
    const x=rows[r]||[];
    const a=label(x[s]), b=clean(x[s+1]), c=clean(x[s+2]), d=x[s+3], e=x[s+4];
    if(!a&&!b&&!c)continue;
    if(/^※/.test(a))break;
    if(/事務所用|共有/.test(a)&&!b&&!c){office=true;sec='';continue}
    if(office){
      // 事務所用の携帯・共有内線：拠点名は上から引き継ぐ
      if(a)sec=a;
      const label=[b,c].filter(Boolean).join(' ');
      const mob=phone(d), ext=phone(e);
      if(mob||ext)out.push({sec,dept:'事務所用',name:sec+(label?' '+label:''),no:'',mob,ext,office:true});
      continue;
    }
    if(!b&&!c){sec=a;dept='';continue}            // 拠点・部の見出し行
    if(!c)continue;
    let rowDept=dept;
    if(a&&a!=='〃'){
      if(a.includes('⇒'))rowDept=a;                // 出向先などはその行だけ
      else dept=rowDept=a;
    }
    out.push({sec,dept:rowDept,name:c.replace(/ +/g,' '),no:/^\d+$/.test(b)?b:'',note:/^\d+$/.test(b)?'':b,mob:phone(d),ext:phone(e)});
  }
}

async function readFile(f){
  if(!f)return;
  toast('読み込み中…');
  try{
    await loadSheetJS();
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    const data=parseWorkbook(wb);
    data.file=f.name; data.loadedAt=new Date().toISOString();
    const before=DB?DB.people.length:null;
    DB=data;
    if(!store.set(KEY,DB))alert('この端末に保存できませんでした（プライベートブラウズ等）。ページを閉じると消えます。');
    closeSheet(); pickStartFilter(); render();
    toast(`${data.people.length}名を読み込みました`+(before!=null&&before!==data.people.length?`（前回 ${before}名）`:''));
  }catch(err){
    console.error(err);
    alert('読み込めませんでした。\n'+(err.message||err));
  }
}

/* ── 描画 ── */
const keyOf=p=>p.office?'事務所:'+p.name:(p.no||'')+':'+tight(p.name);
// お気に入りがあれば★から、なければ全員から始める
function pickStartFilter(){
  const has=[...favs].some(k=>DB.people.some(p=>keyOf(p)===k)||DB.offices.some(o=>'拠点:'+o.name===k));
  filter=has?'★':'すべて';
}
function sections(){
  const seen=[];for(const p of DB.people){const k=p.office?'事務所用':p.sec;if(k&&!seen.includes(k))seen.push(k)}
  return seen;
}
function renderChips(){
  const list=['★','すべて',...sections(),...(DB.offices.length?['拠点代表']:[])];
  if(!list.includes(filter))filter='すべて';
  $('#chips').innerHTML=list.map(k=>`<button class="chip${k===filter?' on':''}" data-f="${esc(k)}">${k==='★'?'★ お気に入り':esc(k)}</button>`).join('');
}
function btn(kind,num,label,text){
  if(!num)return `<span class="call off"><small>${label}</small><b>—</b></span>`;
  const shown=text||(kind==='mob'?fmtTel(num):num);
  return `<a class="call ${kind}" href="tel:${num}" data-n="${esc(shown)}"><small>${label}</small><b>${esc(shown)}</b></a>`;
}
function cardPerson(p){
  const k=keyOf(p), on=favs.has(k);
  const sub=[p.office?'':p.sec,p.dept,p.note].filter(Boolean).join(' / ');
  return `<div class="card"><button class="star${on?' on':''}" data-k="${esc(k)}" aria-label="お気に入り">${on?'★':'☆'}</button>
    <div class="who"><div class="nm">${esc(p.name)}</div><div class="dp">${esc(sub)}</div></div>
    <div class="acts">${acts(p)}</div></div>`;
}
// 「内線」と聞かれたら内線だけ、「携帯」なら携帯だけを出す
function acts(p){
  if(want==='ext')return btn('ext',p.ext,'内線');
  if(want==='mob')return btn('mob',p.mob,'携帯');
  return btn('mob',p.mob,'携帯')+btn('ext',p.ext,'内線');
}
function answer(p){
  const sub=[p.office?'':p.sec,p.dept].filter(Boolean).join(' / ');
  const what=want==='ext'?'の内線':want==='mob'?'の携帯':'の番号';
  return `<div class="ans"><div class="ans-q"><b>${esc(p.name)}</b> さん${what}　<span>${esc(sub)}</span></div>
    <div class="acts">${acts(p)}</div></div>`;
}
function cardOffice(o){
  const k='拠点:'+o.name, on=favs.has(k);
  return `<div class="card"><button class="star${on?' on':''}" data-k="${esc(k)}" aria-label="お気に入り">${on?'★':'☆'}</button>
    <div class="who"><div class="nm">${esc(o.name)}</div><div class="dp">${esc(o.fax?'FAX '+o.fax:o.addr)}</div></div>
    <div class="acts">${btn('mob',o.tel,'代表',o.telText)}</div></div>`;
}
function matches(item,isOffice){
  if(!term)return true;
  const qd=digits(term), qf=fold(term);
  const hay=isOffice?fold(item.name+item.addr):fold([item.name,item.sec,item.dept,item.note].join(''));
  if(qf&&hay.includes(qf))return true;
  if(qd.length>=2){const nums=isOffice?[item.tel,item.fax]:[item.mob,item.ext,item.no];return nums.some(n=>n&&digits(n).includes(qd))}
  return false;
}
function render(){
  $('#top').hidden=false;
  $('#asof').textContent=[DB.asof&&DB.asof+'現在',DB.people.filter(p=>!p.office).length+'名'].filter(Boolean).join(' ・ ');
  renderChips();
  const f=query?'すべて':filter; // 検索中は全体から探す
  let html='', n=0;
  const groups=[];
  if(f==='★'){
    const ps=DB.people.filter(p=>favs.has(keyOf(p))), os=DB.offices.filter(o=>favs.has('拠点:'+o.name));
    if(!ps.length&&!os.length){
      $('#main').innerHTML=`<div class="empty">よく掛ける人の ☆ を押すと、ここに並びます。<br>次からは開いてすぐワンタップで発信できます。<br><br><button class="tbtn" data-f="すべて">全員を表示</button></div>`;return;
    }
    groups.push(['お気に入り',ps.map(cardPerson).concat(os.map(cardOffice))]);
  }else{
    if(f!=='拠点代表'){
      const by=new Map();
      for(const p of DB.people){
        const g=p.office?'事務所用':p.sec;
        if(f!=='すべて'&&g!==f)continue;
        if(!matches(p,false))continue;
        if(!by.has(g))by.set(g,[]);by.get(g).push(p);
      }
      for(const [g,ps] of by)groups.push([g,ps.map(cardPerson)]);
    }
    if(f==='拠点代表'||f==='すべて'){
      const os=DB.offices.filter(o=>matches(o,true));
      if(os.length)groups.push(['拠点代表',os.map(cardOffice)]);
    }
  }
  for(const [g,cards] of groups){
    if(!showAll&&n>=LIMIT)break;
    const take=showAll?cards:cards.slice(0,LIMIT-n);
    html+=`<div class="grp-h">${esc(g)}<span>${cards.length}</span></div>`+take.join('');n+=take.length;
  }
  const total=groups.reduce((a,g)=>a+g[1].length,0);
  if(!total)html=`<div class="empty">「${esc(term||query)}」に当てはまる人はいません。<br><small>名前は漢字の一部（例：中澤→「中澤」「中沢」）で探せます。ひらがなの読みでは探せません。</small></div>`;
  else{
    if(n<total)html+=`<button class="tbtn more" id="more">残り ${total-n} 件を表示</button>`;
    // 名前で1人に絞れたら、答えを一番上に大きく出す
    if(term&&f!=='★'){
      const hit=DB.people.filter(p=>matches(p,false));
      if(hit.length===1)html=total===1?answer(hit[0]):answer(hit[0])+html;
      else if(hit.length>1&&hit.length<=8)html=`<div class="hint">${hit.length}人見つかりました。</div>`+html;
    }
  }
  $('#main').classList.toggle('one',!!want);
  $('#main').innerHTML=html;
}

function renderIntro(){
  $('#top').hidden=true;
  $('#main').innerHTML=`<div class="intro">
    <h1>内線・携帯帳</h1>
    <p>社員の内線・携帯番号一覧表（Excel）を一度読み込むと、この端末に保存され、次からは開くだけで使えます。名前を2〜3文字打って、番号ボタンをタップすれば発信します。</p>
    <div class="drop" id="drop">ここをタップしてExcelを選ぶ<br><small style="color:var(--ink3)">（PCはファイルをドラッグでも可）</small></div>
    <div class="note">・番号データはこの端末の中だけに保存され、どこにも送信されません。<br>・毎月の更新は、右上の「更新」から新しいExcelを選ぶだけです。<br>・ホーム画面に追加しておくとアプリのように開けます。</div>
  </div>`;
}

/* ── 設定シート ── */
function openSheet(){
  const d=DB;
  $('#info').innerHTML=d?`<span>基準日</span><b>${esc(d.asof||'—')}</b><span>ファイル</span><b>${esc(d.file||'—')}</b>
    <span>読み込み</span><b>${esc(new Date(d.loadedAt).toLocaleString('ja-JP'))}</b>
    <span>件数</span><b>社員 ${d.people.filter(p=>!p.office).length}名 / 事務所用 ${d.people.filter(p=>p.office).length} / 拠点 ${d.offices.length}</b>`:'<span>なし</span><b></b>';
  $('#sheet').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on')}
function exportFile(){
  if(!DB)return;
  const json=JSON.stringify(DB).replace(/</g,'\\u003c');
  const html=PRISTINE.replace(/(<script id="embedded" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`内線・携帯帳_${(DB.asof||'').replace(/[^\w一-龠0-9年月日]/g,'')||'最新'}.html`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('保存しました');
}

/* ── 操作 ── */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

document.addEventListener('click',e=>{
  const call=e.target.closest('a.call');
  if(call&&!isTouch){
    // PCは電話を掛けられないことが多いので、番号をコピーする（Ctrl/⌘+クリックなら発信アプリへ）
    if(e.ctrlKey||e.metaKey)return;
    e.preventDefault();
    const n=call.dataset.n;
    (navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast(n+' をコピーしました'),()=>toast(n));
    return;
  }
  const st=e.target.closest('.star');
  if(st){const k=st.dataset.k;favs.has(k)?favs.delete(k):favs.add(k);store.set(FAV,[...favs]);
    st.classList.toggle('on');st.textContent=favs.has(k)?'★':'☆';if(filter==='★'&&!query)render();return}
  const ch=e.target.closest('[data-f]');
  if(ch){filter=ch.dataset.f;showAll=false;if(query){setQuery('');$('#q').value='';$('#clr').classList.remove('on')}render();scrollTo(0,0);return}
  if(e.target.id==='more'){showAll=true;render();return}
  if(e.target.closest('#drop'))$('#file').click();
});
function setQuery(v){query=v.trim();({term,want}=parseAsk(query))}
$('#q').addEventListener('input',e=>{setQuery(e.target.value);showAll=false;$('#clr').classList.toggle('on',!!query);render()});
$('#q').addEventListener('keydown',e=>{
  // Enterで先頭の人の携帯（なければ内線）へ
  if(e.key!=='Enter')return;
  const first=$('#main a.call');if(first){e.preventDefault();first.click()}
});
$('#clr').onclick=()=>{$('#q').value='';setQuery('');$('#clr').classList.remove('on');render();$('#q').focus()};
$('#btnUpd').onclick=openSheet;
$('#btnClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#btnPick2').onclick=()=>$('#file').click();
$('#btnExport').onclick=exportFile;
$('#btnClear').onclick=()=>{if(confirm('この端末の番号データを消去しますか？')){store.del(KEY);DB=null;closeSheet();renderIntro()}};
$('#file').addEventListener('change',e=>{readFile(e.target.files[0]);e.target.value=''});
document.addEventListener('dragover',e=>{e.preventDefault();$('#drop')?.classList.add('hov')});
document.addEventListener('dragleave',()=>$('#drop')?.classList.remove('hov'));
document.addEventListener('drop',e=>{e.preventDefault();$('#drop')?.classList.remove('hov');readFile(e.dataTransfer.files[0])});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')&&DB){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape')closeSheet();
});

/* ── 起動 ── */
(function boot(){
  let local=store.get(KEY), emb=null;
  try{const t=$('#embedded').textContent.trim();if(t)emb=JSON.parse(t)}catch(e){}
  // 配布ファイルの方が新しければそちらを使う
  DB=(emb&&(!local||emb.loadedAt>local.loadedAt))?emb:local;
  if(DB&&DB===emb)store.set(KEY,emb);
  if(DB&&DB.people){
    pickStartFilter();
    // ポータル等から naisen.html?q=中澤 や ?q=内線 で開いたら、その検索ですぐ表示する
    const pq=new URLSearchParams(location.search).get('q')||'';
    if(pq){$('#q').value=pq;setQuery(pq);$('#clr').classList.add('on')}
    render();
    if(!isTouch)$('#q').focus();
  }else{DB=null;renderIntro()}
})();
</script>
</body>
</html>
